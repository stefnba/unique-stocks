name: Pipelines CI

on:
  pull_request:
  push:
    branches:
      - main
      - prod-ready

permissions:
  contents: read

concurrency:
  group: pipelines-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LAKE_NAME: unique_stocks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/pipelines/uv.lock

      - name: Install Python
        working-directory: apps/pipelines
        run: uv python install 3.14.3

      - name: Install dependencies
        working-directory: apps/pipelines
        run: uv sync --frozen --extra dashboard

      - name: Quality checks
        working-directory: apps/pipelines
        run: make ci-local

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
