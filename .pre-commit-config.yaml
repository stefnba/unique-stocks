repos:
  - repo: local
    hooks:
      - id: pipelines-ruff-check
        name: pipelines ruff check
        entry: apps/pipelines/scripts/run_uv.sh
        args: [ruff, check, --fix]
        language: script
        files: ^apps/pipelines/
        types_or: [python, pyi]

      - id: pipelines-ruff-format
        name: pipelines ruff format
        entry: apps/pipelines/scripts/run_uv.sh
        args: [ruff, format]
        language: script
        files: ^apps/pipelines/
        types_or: [python, pyi]

      - id: pipelines-sqlfluff-fix
        name: pipelines sqlfluff fix
        entry: apps/pipelines/scripts/run_uv.sh
        args: [sqlfluff, fix, --disable-progress-bar]
        language: script
        files: ^apps/pipelines/(dbt|lake/migrations)/.*\.sql$
        types: [sql]

      - id: markdown-format
        name: markdown format
        entry: apps/pipelines/scripts/run_uv.sh
        args: [mdformat, --wrap, keep, --extensions, gfm]
        language: script
        types_or: [markdown]

      - id: yaml-lint
        name: yaml lint
        entry: apps/pipelines/scripts/run_uv.sh
        args: [yamllint, -c, .yamllint]
        language: script
        types_or: [yaml]
