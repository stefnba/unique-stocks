repos:
  - repo: local
    hooks:
      - id: pipelines-ruff-format
        name: pipelines ruff format
        entry: uv run --project apps/pipelines ruff format
        language: system
        files: ^apps/pipelines/
        types_or: [python, pyi]

      - id: pipelines-ruff-check
        name: pipelines ruff check
        entry: uv run --project apps/pipelines ruff check --fix
        language: system
        files: ^apps/pipelines/
        types_or: [python, pyi]
