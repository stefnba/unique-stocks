repos:
  - repo: local
    hooks:
      - id: pipelines-ruff-check
        name: pipelines ruff check
        entry: apps/pipelines/scripts/run_uv.sh
        args: [ruff, check, --fix]
        language: script
        files: ^apps/pipelines/
        types_or: [python, pyi]

      - id: pipelines-ruff-format
        name: pipelines ruff format
        entry: apps/pipelines/scripts/run_uv.sh
        args: [ruff, format]
        language: script
        files: ^apps/pipelines/
        types_or: [python, pyi]
