repos:
  - repo: local
    hooks:
      - id: pipelines-ruff-check
        name: pipelines ruff check
        entry: apps/pipelines/scripts/run_uv.sh
        args: [ruff, check, --fix]
        language: script
        files: ^apps/pipelines/
        types_or: [python, pyi]

      - id: pipelines-ruff-format
        name: pipelines ruff format
        entry: apps/pipelines/scripts/run_uv.sh
        args: [ruff, format]
        language: script
        files: ^apps/pipelines/
        types_or: [python, pyi]

      - id: pipelines-sqlfluff-lint
        name: pipelines sqlfluff lint
        entry: apps/pipelines/scripts/run_uv.sh
        args: [sqlfluff, lint, --disable-progress-bar]
        language: script
        files: ^apps/pipelines/(dbt/(macros|models|tests)|lake/migrations)/.*\.sql$
        types: [sql]

      - id: prettier-format
        name: prettier format markdown/yaml/json
        entry: prettier --write
        args: [--ignore-unknown]
        language: node
        additional_dependencies: [prettier@3.8.3]
        files: \.(md|markdown|ya?ml|json|jsonc|code-workspace)$

      - id: markdownlint-format
        name: markdownlint format
        entry: markdownlint-cli2
        args: [--fix]
        language: node
        additional_dependencies: [markdownlint-cli2@0.22.1]
        files: \.(md|markdown)$

      - id: prettier-check
        name: prettier check markdown/yaml/json
        entry: prettier --check
        args: [--ignore-unknown]
        language: node
        additional_dependencies: [prettier@3.8.3]
        files: \.(md|markdown|ya?ml|json|jsonc|code-workspace)$
        stages: [manual]

      - id: markdownlint-check
        name: markdownlint check
        entry: markdownlint-cli2
        language: node
        additional_dependencies: [markdownlint-cli2@0.22.1]
        files: \.(md|markdown)$
        stages: [manual]
