connector.name=hive
hive.metastore.uri=thrift://hive-metastore:9083
hive.s3.path-style-access=true
hive.s3.endpoint=${ENV:AWS_S3_ENDPOINT}
hive.s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
hive.s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}
hive.storage-format=PARQUET
# Recursively search for data in subdirectories if set to true
hive.recursive-directories=false
