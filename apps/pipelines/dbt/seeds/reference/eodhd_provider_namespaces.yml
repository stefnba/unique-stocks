version: 2

seeds:
  - name: provider_namespace_policy
    description: Explicit operational policy for provider endpoint namespaces. Provider catalog rows remain visible, but only rows opted in here are eligible for Python ingestion and blocking coverage gates.
    columns:
      - name: data_provider
        description: Market data provider that owns the namespace policy.
        data_tests:
          - not_null
      - name: provider_exchange_code
        description: Provider endpoint path and provider_instrument_code suffix code governed by this policy row.
        data_tests:
          - not_null
      - name: universe_tier
        description: Operational tier for this namespace.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - core_v1
                  - watchlist
                  - catalog_only
                  - disabled
      - name: is_enabled_for_instrument
        description: True when instrument reference flows may ingest this provider namespace by default.
        data_tests:
          - not_null
      - name: is_enabled_for_eod_price
        description: True when daily EOD price flows may ingest this provider namespace by default.
        data_tests:
          - not_null
      - name: is_enabled_for_eod_backfill
        description: True when historical EOD backfill may ingest this provider namespace by default.
        data_tests:
          - not_null
      - name: is_enabled_for_fundamental
        description: True when fundamentals flows may auto-discover provider instruments in this namespace.
        data_tests:
          - not_null
      - name: daily_coverage_mode
        description: Daily price coverage contract for this namespace.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - blocking
                  - monitor_only
                  - none
      - name: historical_coverage_mode
        description: Historical price coverage contract for this namespace.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - full_assurance
                  - on_demand
                  - none
      - name: region
        description: Coarse region used for operational grouping.
        data_tests:
          - not_null
      - name: priority
        description: Lower numbers are ingested first when humans review or operators run narrow scopes.
        data_tests:
          - not_null
      - name: review_reason
        description: Human-readable reason this namespace is in its current tier.
        data_tests:
          - not_null
      - name: owner
        description: Team or role responsible for reviewing this policy row.
        data_tests:
          - not_null
      - name: last_reviewed_on
        description: Date when this policy row was last reviewed.
        data_tests:
          - not_null

  - name: eodhd_provider_namespaces
    description: Curated EODHD symbol namespaces that are accepted by provider endpoints but omitted from /exchanges-list. Runtime eligibility is governed by provider_namespace_policy.
    columns:
      - name: data_provider
        description: Market data provider that owns the namespace.
        data_tests:
          - not_null
      - name: provider_exchange_code
        description: Provider endpoint path and API symbol suffix code, such as INDX in GDAXI.INDX.
        data_tests:
          - not_null
      - name: provider_code_kind
        description: Classification for the provider code when it is not a normal catalog exchange.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - index_namespace
      - name: display_name
        description: Human-readable namespace label.
        data_tests:
          - not_null
      - name: asset_type_hint
        description: Expected dominant provider asset type for instruments in this namespace.
      - name: country_iso2
        description: Optional ISO 3166-1 alpha-2 country when the namespace is country-specific.
      - name: currency
        description: Optional currency when the namespace is single-currency.
      - name: is_enabled_for_instrument
        description: Historical verification hint retained with the curated namespace metadata; provider_namespace_policy controls runtime instrument ingestion.
        data_tests:
          - not_null
      - name: is_enabled_for_eod_price
        description: Historical verification hint retained with the curated namespace metadata; provider_namespace_policy controls runtime EOD price ingestion.
        data_tests:
          - not_null
      - name: verification_symbol
        description: Representative exchange-qualified API symbol used to verify endpoint support.
        data_tests:
          - not_null
      - name: last_verified_on
        description: Date endpoint support was last manually verified.
        data_tests:
          - not_null
      - name: notes
        description: Short source and verification note for humans reviewing curated provider coverage.

  - name: exchange_calendar_coverage_overrides
    description: Reviewed provider schedule-code holiday-calendar coverage windows. Rows assert that the available holiday rows are complete enough for coverage decisions over the stated date range.
    columns:
      - name: data_provider
        description: Market data provider that owns the schedule code.
        data_tests:
          - not_null
      - name: provider_schedule_exchange_code
        description: Provider schedule endpoint code whose holiday coverage was reviewed.
        data_tests:
          - not_null
      - name: coverage_start_date
        description: First local exchange date covered by the reviewed holiday calendar window.
        data_tests:
          - not_null
      - name: coverage_end_date
        description: Last local exchange date covered by the reviewed holiday calendar window.
        data_tests:
          - not_null
      - name: coverage_confidence
        description: Confidence assigned by the reviewer for this coverage assertion.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - high
                  - medium
                  - low
      - name: source_name
        description: Source used to review the coverage window.
        data_tests:
          - not_null
      - name: source_url
        description: Optional URL for the reviewed source.
      - name: reviewed_on
        description: Date when the coverage assertion was reviewed.
        data_tests:
          - not_null
      - name: notes
        description: Human-readable review note.
