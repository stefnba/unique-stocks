version: 2

models:
  - name: fct_fundamental_statement
    description: Gold long-form financial statement facts for stock fundamentals.
    columns:
      - name: fundamental_statement_pk
        description: Deterministic hashed primary key for one statement metric observation.
        data_tests:
          - not_null
          - unique
      - name: instrument_pk
        description: Foreign key to dim_instrument_core when the statement belongs to an active tradable instrument.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_instrument_core')
                field: instrument_pk
      - name: data_provider
        description: Provider that supplied the statement metric.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [eodhd]
      - name: provider_exchange_code
        description: Provider exchange code for the provider instrument namespace.
        data_tests:
          - not_null
      - name: provider_instrument_code
        description: Provider stock instrument code.
        data_tests:
          - not_null
      - name: snapshot_date
        description: Snapshot date for the fundamentals document.
        data_tests:
          - not_null
      - name: statement_type
        description: Statement family.
        data_tests:
          - not_null
      - name: period_type
        description: Reporting cadence.
        data_tests:
          - not_null
      - name: period_end_date
        description: Financial reporting period end date.
        data_tests:
          - not_null
      - name: metric_name
        description: Provider metric name.
        data_tests:
          - not_null
      - name: metric_value
        description: Numeric statement metric value.
        data_tests:
          - not_null
      - name: ingested_at
        description: Timestamp when the metric row was written to Bronze.
        data_tests:
          - not_null

