  - name: fct_fundamental_fund_holding
    description: Gold holdings for ETF and mutual-fund fundamentals in one normalized shape.
    columns:
      - name: fundamental_fund_holding_pk
        description: Deterministic hashed primary key for one fund holding row.
        data_tests:
          - not_null
          - unique
      - name: instrument_pk
        description: Foreign key to dim_instrument_core when the holding belongs to an active tradable fund instrument.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_instrument_core')
                field: instrument_pk
      - name: data_provider
        description: Provider that supplied the holding.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [eodhd]
      - name: provider_exchange_code
        description: Provider exchange code for the parent fund instrument namespace.
        data_tests:
          - not_null
      - name: provider_instrument_code
        description: Provider parent fund instrument code.
        data_tests:
          - not_null
      - name: snapshot_date
        description: Snapshot date for the fundamentals document.
        data_tests:
          - not_null
      - name: instrument_family
        description: Parent instrument family.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [etf, fund]
      - name: holding_source
        description: Staging source used for the holding row.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [etf_holding, mutual_fund_holding]
      - name: holding_name
        description: Holding display name.
        data_tests:
          - not_null
      - name: weight_percent
        description: Provider-reported portfolio weight percentage.
      - name: ingested_at
        description: Timestamp when the holding row was written to Bronze.
        data_tests:
          - not_null

