version: 2

models:
  - name: dim_exchange
    description: Gold canonical exchange and market dimension from the latest ISO 10383 MIC registry snapshot.
    columns:
      - name: exchange_pk
        description: Deterministic hashed primary key for one exchange or market.
        data_tests:
          - not_null
          - unique
      - name: mic
        description: Market Identifier Code for the exchange or segment.
        data_tests:
          - not_null
      - name: operating_mic
        description: Operating MIC that owns or equals this MIC.
        data_tests:
          - not_null
      - name: mic_type
        description: MIC type, either OPRT for operating MICs or SGMT for segment MICs.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - OPRT
                  - SGMT
      - name: exchange_name
        description: Canonical exchange or market name.
        data_tests:
          - not_null
      - name: legal_entity_name
        description: Legal name of the entity owning the market.
      - name: lei
        description: Legal Entity Identifier when supplied.
      - name: market_category_code
        description: ISO 10383 market category code.
      - name: acronym
        description: Known market acronym when supplied.
      - name: country_iso2
        description: ISO 3166-1 alpha-2 country code.
        data_tests:
          - not_null
      - name: city
        description: City where the market is located.
        data_tests:
          - not_null
      - name: website
        description: Market website when supplied.
      - name: status
        description: Lowercase registry lifecycle status.
        data_tests:
          - not_null
      - name: creation_date
        description: Date the MIC was originally created.
        data_tests:
          - not_null
      - name: last_update_date
        description: Date the MIC was last modified.
      - name: last_validation_date
        description: Date the MIC was last reviewed for correctness.
      - name: expiry_date
        description: Date the MIC was deactivated, when applicable.
      - name: comments
        description: Registry comments supplied by the source.
      - name: is_operating_mic
        description: True when this row is an operating MIC.
        data_tests:
          - not_null
      - name: is_active
        description: True when the registry status is active.
        data_tests:
          - not_null
      - name: registry_provider
        description: Provider that supplied the canonical registry row.
        data_tests:
          - not_null
      - name: registry_snapshot_date
        description: Source registry snapshot date used for this exchange row.
        data_tests:
          - not_null
      - name: registry_ingested_at
        description: Timestamp when the registry row was written to Bronze.
        data_tests:
          - not_null

  - name: dim_exchange_calendar
    description: Gold latest provider trading-hours calendar by schedule endpoint code.
    columns:
      - name: exchange_calendar_pk
        description: Deterministic hashed primary key for one latest exchange schedule row.
        data_tests:
          - not_null
          - unique
      - name: data_provider
        description: Provider that supplied the exchange schedule.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - eodhd
      - name: provider_schedule_exchange_code
        description: Provider schedule endpoint code for trading-hours requests.
        data_tests:
          - not_null
      - name: linked_provider_exchange_codes
        description: Comma-separated provider request codes linked to this schedule code.
      - name: exchange_schedule_name
        description: Provider display name for the exchange schedule.
        data_tests:
          - not_null
      - name: timezone
        description: IANA timezone name supplied by the provider.
        data_tests:
          - not_null
      - name: session_open
        description: Regular session open time in local exchange time.
        data_tests:
          - not_null
      - name: session_close
        description: Regular session close time in local exchange time.
        data_tests:
          - not_null
      - name: working_days
        description: Provider working-day expression for regular sessions.
        data_tests:
          - not_null
      - name: pre_market_open
        description: Pre-market session open time when supplied.
      - name: pre_market_close
        description: Pre-market session close time when supplied.
      - name: after_hours_open
        description: After-hours session open time when supplied.
      - name: after_hours_close
        description: After-hours session close time when supplied.
      - name: lunch_break_start
        description: Lunch break start time when supplied.
      - name: lunch_break_end
        description: Lunch break end time when supplied.
      - name: has_pre_market
        description: True when any pre-market boundary is present.
        data_tests:
          - not_null
      - name: has_after_hours
        description: True when any after-hours boundary is present.
        data_tests:
          - not_null
      - name: has_lunch_break
        description: True when any lunch-break boundary is present.
        data_tests:
          - not_null
      - name: schedule_snapshot_date
        description: Latest schedule snapshot date for this schedule code.
        data_tests:
          - not_null
      - name: schedule_ingested_at
        description: Timestamp when the schedule row was written to Bronze.
        data_tests:
          - not_null

  - name: dim_exchange_holiday_calendar
    description: Gold latest provider holiday and early-close calendar by schedule endpoint code.
    columns:
      - name: exchange_holiday_calendar_pk
        description: Deterministic hashed primary key for one latest holiday or early-close row.
        data_tests:
          - not_null
          - unique
      - name: data_provider
        description: Provider that supplied the holiday row.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - eodhd
      - name: provider_schedule_exchange_code
        description: Provider schedule endpoint code for the holiday calendar.
        data_tests:
          - not_null
      - name: linked_provider_exchange_codes
        description: Comma-separated provider request codes linked to this schedule code.
      - name: exchange_schedule_name
        description: Provider display name for the exchange schedule.
      - name: timezone
        description: IANA timezone name supplied by the provider.
      - name: holiday_date
        description: Holiday or early-close date in local exchange calendar terms.
        data_tests:
          - not_null
      - name: holiday_name
        description: Provider holiday display name.
        data_tests:
          - not_null
      - name: holiday_type
        description: Lowercase provider holiday type.
        data_tests:
          - not_null
      - name: is_early_close
        description: True when the row represents an early close or has an early close time.
        data_tests:
          - not_null
      - name: early_close_time
        description: Early close time when supplied.
      - name: holiday_snapshot_date
        description: Latest holiday snapshot date for this schedule code.
        data_tests:
          - not_null
      - name: holiday_ingested_at
        description: Timestamp when the holiday row was written to Bronze.
        data_tests:
          - not_null

  - name: dim_exchange_trading_day
    description: Gold provider exchange trading-day calendar by provider request code and local exchange date.
    columns:
      - name: exchange_trading_day_pk
        description: Deterministic hashed primary key for one provider exchange/date.
        data_tests:
          - not_null
          - unique
      - name: exchange_calendar_pk
        description: Foreign key to the mapped provider schedule calendar row, when known.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_exchange_calendar')
                field: exchange_calendar_pk
      - name: exchange_pk
        description: Foreign key to the canonical MIC exchange dimension, when a MIC mapping is known.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_exchange')
                field: exchange_pk
      - name: data_provider
        description: Provider that owns the exchange and schedule codes.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - eodhd
      - name: provider_exchange_code
        description: Provider request code used by instrument and EOD price endpoints.
        data_tests:
          - not_null
      - name: mic
        description: Best mapped Market Identifier Code for the provider request code, when known.
      - name: provider_code_kind
        description: Classification of the provider request code when known.
      - name: source_kind
        description: Source of the provider request code, such as provider catalog or curated seed.
      - name: exchange_catalog_name
        description: Provider display name for the provider request code.
      - name: provider_schedule_exchange_code
        description: Provider schedule endpoint code mapped to the provider request code.
      - name: schedule_mapping_method
        description: Method used to map the provider request code to a schedule endpoint code.
      - name: schedule_mapping_confidence
        description: Confidence of the schedule-code mapping.
      - name: mic_mapping_method
        description: Method used to map the provider request code to a MIC.
      - name: mic_mapping_confidence
        description: Confidence of the MIC mapping.
      - name: exchange_schedule_name
        description: Provider display name for the mapped exchange schedule.
      - name: timezone
        description: IANA timezone for the mapped exchange schedule.
      - name: working_days
        description: Provider working-day expression for regular sessions.
      - name: day_name
        description: Three-letter day name for the local exchange date.
        data_tests:
          - not_null
      - name: trading_day_status
        description: Business status for the provider exchange/date.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - open
                  - early_close
                  - closed_holiday
                  - closed_non_working_day
                  - unknown_calendar
                  - unknown_calendar_coverage
      - name: closure_reason
        description: Closure reason for non-trading dates when known.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - full_holiday
                  - non_working_day
                  - unknown_calendar
                  - unknown_calendar_coverage
      - name: is_calendar_known
        description: True when a schedule-code mapping and latest schedule row are available.
        data_tests:
          - not_null
      - name: is_calendar_coverage_known
        description: True when the mapped holiday calendar covers this local exchange date.
        data_tests:
          - not_null
      - name: calendar_coverage_source
        description: Source used to determine the trusted holiday-calendar coverage horizon.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - provider_holiday_calendar
                  - reviewed_override
                  - provider_holiday_calendar_and_reviewed_override
                  - none
      - name: calendar_coverage_status
        description: Coverage status of the provider holiday calendar for this generated exchange/date.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - covered
                  - before_holiday_coverage
                  - after_holiday_coverage
                  - holiday_coverage_gap
                  - unknown_holiday_coverage
                  - unknown_schedule_mapping
      - name: is_working_day
        description: True when the date's day name is present in the provider working-days expression.
        data_tests:
          - not_null
      - name: is_full_holiday
        description: True when the holiday calendar has a non-early-close holiday for this date.
        data_tests:
          - not_null
      - name: is_early_close
        description: True when the holiday calendar marks this date as an early close.
        data_tests:
          - not_null
      - name: is_trading_day
        description: True when the calendar is known, the date is a working day, and it is not a full holiday.
        data_tests:
          - not_null
      - name: is_closed
        description: True when the calendar is known and the date is not a trading day.
        data_tests:
          - not_null
      - name: has_pre_market
        description: True when the mapped schedule has pre-market boundaries.
      - name: has_after_hours
        description: True when the mapped schedule has after-hours boundaries.
      - name: has_lunch_break
        description: True when the mapped schedule has lunch-break boundaries.
      - name: full_holiday_name
        description: Holiday name for full exchange closures.
      - name: early_close_name
        description: Holiday name for early-close dates.
      - name: session_open
        description: Regular session open time in local exchange time.
      - name: session_close
        description: Regular session close time in local exchange time.
      - name: effective_session_open
        description: Session open time for trading dates; null on closed or unknown-calendar dates.
      - name: effective_session_close
        description: Session close time for trading dates, using early close time when present.
      - name: effective_session_open_local_at
        description: Local exchange timestamp for the effective session open on trading dates.
      - name: effective_session_close_local_at
        description: Local exchange timestamp for the effective session close on trading dates, using early close time when present.
      - name: effective_session_open_utc_at
        description: UTC timestamp for the effective session open, derived from the local timestamp and IANA timezone.
      - name: effective_session_close_utc_at
        description: UTC timestamp for the effective session close, derived from the local timestamp and IANA timezone.
      - name: utc_offset_minutes_at_session_open
        description: Local exchange UTC offset in minutes at the effective session open; negative values are west of UTC.
      - name: utc_offset_minutes_at_session_close
        description: Local exchange UTC offset in minutes at the effective session close; negative values are west of UTC.
      - name: pre_market_open
        description: Pre-market session open time when supplied.
      - name: pre_market_close
        description: Pre-market session close time when supplied.
      - name: after_hours_open
        description: After-hours session open time when supplied.
      - name: after_hours_close
        description: After-hours session close time when supplied.
      - name: lunch_break_start
        description: Lunch break start time when supplied.
      - name: lunch_break_end
        description: Lunch break end time when supplied.
      - name: early_close_time
        description: Early close time when supplied by the holiday calendar.
      - name: trading_date
        description: Local exchange calendar date in the generated provider calendar horizon; the earliest date in this table is not an authoritative exchange inception date.
        data_tests:
          - not_null
      - name: exchange_creation_date
        description: MIC registry creation date for the mapped exchange, when known; not necessarily the exchange's first trading date.
      - name: calendar_coverage_start_date
        description: First holiday-calendar date covered by provider rows and/or reviewed coverage overrides for the mapped schedule code.
      - name: calendar_coverage_end_date
        description: Latest holiday-calendar date covered by provider rows and/or reviewed coverage overrides for the mapped schedule code.
      - name: holiday_coverage_start_date
        description: First holiday date supplied by the provider for the mapped schedule code.
      - name: holiday_coverage_end_date
        description: Latest holiday date supplied by the provider for the mapped schedule code.
      - name: override_coverage_start_date
        description: First reviewed override coverage date for the mapped schedule code, when supplied.
      - name: override_coverage_end_date
        description: Latest reviewed override coverage date for the mapped schedule code, when supplied.
      - name: override_coverage_confidence
        description: Most conservative confidence label among reviewed override rows contributing to the schedule-code horizon.
      - name: override_coverage_source_names
        description: Comma-separated reviewed source names behind the override coverage horizon.
      - name: override_coverage_source_urls
        description: Comma-separated reviewed source URLs behind the override coverage horizon.
      - name: override_coverage_last_reviewed_on
        description: Latest review date among override rows contributing to the schedule-code horizon.
      - name: calendar_start_date
        description: First local date generated for this provider exchange calendar.
        data_tests:
          - not_null
      - name: calendar_start_date_source
        description: Source used to choose the generated calendar start date.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - mic_creation_date
                  - provider_holiday_calendar
                  - reviewed_calendar_coverage
                  - current_date_default
      - name: schedule_snapshot_date
        description: Latest schedule snapshot date used for this row.
      - name: schedule_ingested_at
        description: Timestamp when the schedule row was written to Bronze.

  - name: dim_provider_code_mapping
    description: Gold provider request-code mappings to self codes, MICs, and schedule endpoint codes.
    columns:
      - name: provider_code_mapping_pk
        description: Deterministic hashed primary key for one provider-code mapping row.
        data_tests:
          - not_null
          - unique
      - name: data_provider
        description: Provider that owns the mapping.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - eodhd
      - name: provider_exchange_code
        description: Provider request code used for instrument, price, or fundamentals endpoints.
        data_tests:
          - not_null
      - name: provider_code_kind
        description: Classification of the provider request code when known.
      - name: source_kind
        description: Source of the provider code.
      - name: exchange_catalog_name
        description: Provider display name for the exchange code when known.
      - name: mapping_type
        description: Mapping target type.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - provider_exchange_code
                  - mic
                  - schedule_code
      - name: mapping_code
        description: Mapped code value.
        data_tests:
          - not_null
      - name: mapping_method
        description: Method used to infer the mapping.
        data_tests:
          - not_null
      - name: mapping_confidence
        description: Confidence level for the mapping.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - high
                  - medium
                  - none
