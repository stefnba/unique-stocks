version: 2

models:
  - name: fct_daily_price
    description: Gold daily price bars for app queries and downstream analytics.
    columns:
      - name: daily_price_pk
        description: Deterministic hashed primary key for one provider daily price bar.
        data_tests:
          - not_null
          - unique
      - name: security_pk
        description: Foreign key to dim_security when the priced symbol is in the tradable security dimension.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_security')
                field: security_pk
      - name: data_provider
        description: Provider that supplied the record.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - eodhd
      - name: ticker
        description: Exchange-qualified ticker, such as AAPL.US.
        data_tests:
          - not_null
      - name: provider_exchange_code
        description: Provider exchange code for the listed security, used in endpoint paths and ticker suffixes.
        data_tests:
          - not_null
      - name: bar_date
        description: Trading date for the OHLCV bar.
        data_tests:
          - not_null
      - name: open_price
        description: Opening price for the trading date.
        data_tests:
          - not_null
      - name: high_price
        description: Highest traded price for the trading date.
        data_tests:
          - not_null
      - name: low_price
        description: Lowest traded price for the trading date.
        data_tests:
          - not_null
      - name: close_price
        description: Closing price for the trading date.
        data_tests:
          - not_null
      - name: adjusted_close_price
        description: Provider-adjusted close price when available.
      - name: effective_close_price
        description: Adjusted close when available, otherwise close price.
        data_tests:
          - not_null
      - name: volume
        description: Reported trading volume for the trading date.
        data_tests:
          - not_null
      - name: ingested_at
        description: Timestamp when the row was written to Bronze.
        data_tests:
          - not_null
