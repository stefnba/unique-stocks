version: 2

models:
  - name: fct_daily_price
    description: Gold daily price bars for app queries and downstream analytics.
    columns:
      - name: daily_price_pk
        description: Deterministic hashed primary key for one provider daily price bar.
        data_tests:
          - not_null
          - unique
      - name: instrument_pk
        description: Foreign key to dim_instrument_core when the priced instrument is in the active tradable instrument universe.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_instrument_core')
                field: instrument_pk
      - name: data_provider
        description: Provider that supplied the record.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - eodhd
      - name: provider_instrument_code
        description: Provider instrument code, such as AAPL.
        data_tests:
          - not_null
      - name: provider_exchange_code
        description: Provider exchange code for the listed instrument, used in endpoint paths and provider_instrument_code suffixes.
        data_tests:
          - not_null
      - name: ingestion_mode
        description: Pipeline mode that produced the current Gold price row.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - daily_bulk
                  - historical_backfill
      - name: bar_date
        description: Trading date for the OHLCV bar.
        data_tests:
          - not_null
      - name: open_price
        description: Opening price for the trading date.
        data_tests:
          - not_null
      - name: high_price
        description: Highest traded price for the trading date.
        data_tests:
          - not_null
      - name: low_price
        description: Lowest traded price for the trading date.
        data_tests:
          - not_null
      - name: close_price
        description: Closing price for the trading date.
        data_tests:
          - not_null
      - name: adjusted_close_price
        description: Provider-adjusted close price when available.
      - name: effective_close_price
        description: Adjusted close when available, otherwise close price.
        data_tests:
          - not_null
      - name: volume
        description: Reported trading volume for the trading date.
        data_tests:
          - not_null
      - name: ingested_at
        description: Timestamp when the row was written to Bronze.
        data_tests:
          - not_null
