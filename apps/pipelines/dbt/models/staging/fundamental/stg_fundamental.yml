version: 2

models:
  - name: stg_fundamental_document
    description: Cleaned and deduplicated fundamentals document metadata from Bronze.
    columns:
      - name: ingestion_id
        description: Unique ingestion row identifier from Bronze.
        data_tests:
          - not_null
      - name: snapshot_date
        description: Date the fundamentals document snapshot was ingested.
        data_tests:
          - not_null
      - name: provider_exchange_code
        description: Provider exchange code from the exchange-qualified ticker.
        data_tests:
          - not_null
      - name: ticker
        description: Exchange-qualified ticker requested from the fundamentals endpoint.
        data_tests:
          - not_null
      - name: code
        description: Provider ticker code without exchange suffix.
        data_tests:
          - not_null
      - name: instrument_name
        description: Instrument display name from the provider.
      - name: instrument_type
        description: Provider instrument type from the fundamentals General section.
        data_tests:
          - not_null
      - name: instrument_family
        description: Stable broad instrument family derived from provider type.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - stock
                  - etf
                  - fund
                  - index
                  - bond
                  - unknown
      - name: primary_ticker
        description: Provider primary ticker when supplied.
      - name: provider_listing_exchange_code
        description: Provider listing exchange value from the fundamentals General section.
      - name: provider_updated_at
        description: Provider-reported fundamentals update date.
      - name: top_level_sections
        description: Top-level provider JSON sections present in the document.
      - name: payload_hash
        description: Stable hash of the canonical provider fundamentals document.
        data_tests:
          - not_null
      - name: data_provider
        description: Provider that supplied the record.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - eodhd
      - name: row_hash
        description: Stable hash of the normalized Bronze row.
        data_tests:
          - not_null
      - name: source_uri
        description: S3 URI of the landing object that produced the row.
      - name: ingested_at
        description: Timestamp when the row was written to Bronze.
        data_tests:
          - not_null

