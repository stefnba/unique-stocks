version: 2

models:
  - name: int_provider_code_mapping
    description: Silver mapping rows linking provider request codes to MICs and schedule endpoint codes.
    columns:
      - name: provider_code_mapping_id
        description: Stable key for one provider-code mapping row.
        data_tests:
          - not_null
      - name: data_provider
        description: Provider that owns the mapping.
        data_tests:
          - not_null
      - name: provider_exchange_code
        description: Provider request code used for instrument, price, or fundamentals endpoints.
        data_tests:
          - not_null
      - name: provider_code_kind
        description: Classification of the provider request code when known.
      - name: source_kind
        description: Source of the provider code, such as provider catalog or curated seed.
      - name: exchange_catalog_name
        description: Provider display name for the exchange code when known.
      - name: mapping_type
        description: Mapping target type.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - provider_exchange_code
                  - mic
                  - schedule_code
      - name: mapping_code
        description: Mapped code value.
        data_tests:
          - not_null
      - name: mapping_method
        description: Method used to infer the mapping.
        data_tests:
          - not_null
      - name: mapping_confidence
        description: Confidence level for the mapping.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - high
                  - medium
                  - none

  - name: int_exchange_calendar
    description: Latest provider exchange trading-hours calendar for schedule endpoint codes linked to EOD-price-enabled provider namespaces.
    columns:
      - name: exchange_calendar_id
        description: Stable key for one latest exchange schedule row.
        data_tests:
          - not_null
      - name: data_provider
        description: Provider that supplied the exchange schedule.
        data_tests:
          - not_null
      - name: provider_schedule_exchange_code
        description: Provider schedule endpoint code for trading-hours requests.
        data_tests:
          - not_null
      - name: linked_provider_exchange_codes
        description: Comma-separated EOD-price-enabled provider request codes linked to this schedule code.
      - name: exchange_schedule_name
        description: Provider display name for the exchange schedule.
        data_tests:
          - not_null
      - name: timezone
        description: IANA timezone name supplied by the provider.
        data_tests:
          - not_null
      - name: session_open
        description: Regular session open time in local exchange time.
        data_tests:
          - not_null
      - name: session_close
        description: Regular session close time in local exchange time.
        data_tests:
          - not_null
      - name: working_days
        description: Provider working-day expression for regular sessions.
        data_tests:
          - not_null
      - name: pre_market_open
        description: Pre-market session open time when supplied.
      - name: pre_market_close
        description: Pre-market session close time when supplied.
      - name: after_hours_open
        description: After-hours session open time when supplied.
      - name: after_hours_close
        description: After-hours session close time when supplied.
      - name: lunch_break_start
        description: Lunch break start time when supplied.
      - name: lunch_break_end
        description: Lunch break end time when supplied.
      - name: has_pre_market
        description: True when any pre-market boundary is present.
        data_tests:
          - not_null
      - name: has_after_hours
        description: True when any after-hours boundary is present.
        data_tests:
          - not_null
      - name: has_lunch_break
        description: True when any lunch-break boundary is present.
        data_tests:
          - not_null
      - name: schedule_snapshot_date
        description: Latest schedule snapshot date for this schedule code.
        data_tests:
          - not_null
      - name: schedule_row_hash
        description: Stable hash of the normalized Bronze schedule row.
        data_tests:
          - not_null
      - name: schedule_source_uri
        description: S3 URI of the schedule landing object.
      - name: schedule_ingested_at
        description: Timestamp when the schedule row was written to Bronze.
        data_tests:
          - not_null

  - name: int_exchange_holiday_calendar
    description: Latest provider holiday and early-close calendar for schedule endpoint codes linked to EOD-price-enabled provider namespaces.
    columns:
      - name: exchange_holiday_calendar_id
        description: Stable key for one latest holiday or early-close row.
        data_tests:
          - not_null
      - name: data_provider
        description: Provider that supplied the holiday row.
        data_tests:
          - not_null
      - name: provider_schedule_exchange_code
        description: Provider schedule endpoint code for the holiday calendar.
        data_tests:
          - not_null
      - name: linked_provider_exchange_codes
        description: Comma-separated EOD-price-enabled provider request codes linked to this schedule code.
      - name: exchange_schedule_name
        description: Provider display name for the exchange schedule.
      - name: timezone
        description: IANA timezone name supplied by the provider.
      - name: holiday_date
        description: Holiday or early-close date in local exchange calendar terms.
        data_tests:
          - not_null
      - name: holiday_name
        description: Provider holiday display name.
        data_tests:
          - not_null
      - name: holiday_type
        description: Lowercase provider holiday type.
        data_tests:
          - not_null
      - name: is_early_close
        description: True when the row represents an early close or has an early close time.
        data_tests:
          - not_null
      - name: early_close_time
        description: Early close time when supplied.
      - name: holiday_snapshot_date
        description: Latest holiday snapshot date for this schedule code.
        data_tests:
          - not_null
      - name: holiday_row_hash
        description: Stable hash of the normalized Bronze holiday row.
        data_tests:
          - not_null
      - name: holiday_source_uri
        description: S3 URI of the holiday landing object.
      - name: holiday_ingested_at
        description: Timestamp when the holiday row was written to Bronze.
        data_tests:
          - not_null

  - name: int_exchange_trading_day
    description: Provider exchange trading-day calendar by provider request code and local date, generated from the MIC creation date, provider holiday coverage, reviewed calendar-coverage overrides, or current-date fallback through the end of next calendar year or the trusted holiday horizon.
    config:
      tags:
        - ingestion_control
    columns:
      - name: exchange_trading_day_id
        description: Stable key for one provider exchange/date calendar row.
        data_tests:
          - not_null
      - name: data_provider
        description: Provider that owns the exchange code.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - eodhd
      - name: provider_exchange_code
        description: Provider request code used for EOD price endpoints.
        data_tests:
          - not_null
      - name: mic
        description: Best mapped Market Identifier Code for the provider request code, when known.
      - name: mic_mapping_method
        description: Method used to map the provider request code to a MIC.
      - name: mic_mapping_confidence
        description: Confidence of the MIC mapping.
      - name: exchange_creation_date
        description: MIC registry creation date for the mapped exchange, when known; not necessarily the exchange's first trading date.
      - name: calendar_coverage_start_date
        description: First holiday-calendar date covered by provider rows and/or reviewed coverage overrides for the mapped schedule code.
      - name: calendar_coverage_end_date
        description: Latest holiday-calendar date covered by provider rows and/or reviewed coverage overrides for the mapped schedule code.
      - name: calendar_start_date
        description: First local date generated for this provider exchange calendar, based on MIC creation date, holiday coverage, or current date fallback.
        data_tests:
          - not_null
      - name: calendar_start_date_source
        description: Source used to choose the generated calendar start date.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - mic_creation_date
                  - provider_holiday_calendar
                  - reviewed_calendar_coverage
                  - current_date_default
      - name: provider_schedule_exchange_code
        description: Provider schedule endpoint code mapped to the EOD price request code, when known.
      - name: schedule_mapping_method
        description: Method used to map the EOD price request code to a schedule endpoint code.
      - name: schedule_mapping_confidence
        description: Confidence of the schedule-code mapping.
      - name: bar_date
        description: Local exchange date evaluated for EOD price coverage.
        data_tests:
          - not_null
      - name: day_name
        description: Three-letter local day name used to match provider working_days.
        data_tests:
          - not_null
      - name: is_calendar_known
        description: True when a schedule-code mapping and latest schedule row are available.
        data_tests:
          - not_null
      - name: is_calendar_coverage_known
        description: True when the mapped holiday calendar covers this local exchange date.
        data_tests:
          - not_null
      - name: calendar_coverage_source
        description: Source used to determine the trusted holiday-calendar coverage horizon.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - provider_holiday_calendar
                  - reviewed_override
                  - provider_holiday_calendar_and_reviewed_override
                  - none
      - name: calendar_coverage_status
        description: Coverage status of the provider holiday calendar for this generated exchange/date.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - covered
                  - before_holiday_coverage
                  - after_holiday_coverage
                  - holiday_coverage_gap
                  - unknown_holiday_coverage
                  - unknown_schedule_mapping
      - name: holiday_coverage_start_date
        description: First holiday date supplied by the provider for the mapped schedule code.
      - name: holiday_coverage_end_date
        description: Latest holiday date supplied by the provider for the mapped schedule code.
      - name: override_coverage_start_date
        description: First reviewed override coverage date for the mapped schedule code, when supplied.
      - name: override_coverage_end_date
        description: Latest reviewed override coverage date for the mapped schedule code, when supplied.
      - name: override_coverage_confidence
        description: Most conservative confidence label among reviewed override rows contributing to the schedule-code horizon.
      - name: override_coverage_source_names
        description: Comma-separated reviewed source names behind the override coverage horizon.
      - name: override_coverage_source_urls
        description: Comma-separated reviewed source URLs behind the override coverage horizon.
      - name: override_coverage_last_reviewed_on
        description: Latest review date among override rows contributing to the schedule-code horizon.
      - name: is_working_day
        description: True when the date's day name is present in the provider working_days expression.
        data_tests:
          - not_null
      - name: is_full_holiday
        description: True when the latest holiday calendar has a non-early-close holiday for this date.
        data_tests:
          - not_null
      - name: is_early_close
        description: True when the latest holiday calendar marks this date as an early close.
        data_tests:
          - not_null
      - name: is_trading_day
        description: True when the calendar and holiday coverage are known, the day is a working day, and the date is not a full holiday.
        data_tests:
          - not_null
