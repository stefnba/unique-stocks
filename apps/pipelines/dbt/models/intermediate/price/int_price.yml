version: 2

models:
  - name: int_eod_price_instrument_history_bounds
    description: Ingestion-control view of first and latest observed EOD price dates by provider exchange/instrument pair.
    config:
      tags:
        - ingestion_control
    columns:
      - name: data_provider
        description: Provider that supplied the price bars.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - eodhd
      - name: provider_exchange_code
        description: Provider exchange code used for the price request namespace.
        data_tests:
          - not_null
      - name: provider_instrument_code
        description: Provider instrument code, such as AAPL.
        data_tests:
          - not_null
      - name: first_observed_price_date
        description: Earliest staged EOD price date observed for the provider exchange/instrument pair.
        data_tests:
          - not_null
      - name: last_observed_price_date
        description: Latest staged EOD price date observed for the provider exchange/instrument pair.
        data_tests:
          - not_null
      - name: observed_price_days
        description: Number of staged EOD price days observed for the provider exchange/instrument pair.
        data_tests:
          - not_null

  - name: int_eod_price_completion_ranges
    description: Ingestion-control view summarizing completed Bronze price coverage ranges by split provider exchange/instrument identity.
    config:
      tags:
        - ingestion_control
    columns:
      - name: data_provider
        description: Provider that supplied the price bars.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - eodhd
      - name: provider_exchange_code
        description: Provider exchange code used for the price ingestion request.
        data_tests:
          - not_null
      - name: provider_instrument_code
        description: Provider instrument code, such as AAPL.
        data_tests:
          - not_null
      - name: min_bar_date
        description: Earliest completed bar date for the provider exchange/instrument pair.
        data_tests:
          - not_null
      - name: max_bar_date
        description: Latest completed bar date for the provider exchange/instrument pair.
        data_tests:
          - not_null
      - name: bar_count
        description: Number of distinct staged price bars included in the range.
        data_tests:
          - not_null

  - name: int_eod_price_backfill_no_data_coverage
    description: Ingestion-control view of exact-range EOD backfill no-data outcomes.
    config:
      tags:
        - ingestion_control
    columns:
      - name: data_provider
        description: Provider for the covered backfill unit.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - eodhd
      - name: provider_exchange_code
        description: Provider exchange code in the backfill unit key.
        data_tests:
          - not_null
      - name: provider_instrument_code
        description: Provider instrument code in the backfill unit key.
        data_tests:
          - not_null
      - name: from_date
        description: Inclusive start date of the no-data backfill range; null means the provider start parameter was omitted.
      - name: to_date
        description: Inclusive end date of the no-data backfill range.
        data_tests:
          - not_null
      - name: unit_key_hash
        description: Stable hash of the exact backfill unit key.
        data_tests:
          - not_null
      - name: reason
        description: Domain reason for the no-data coverage outcome.
      - name: rows_raw
        description: Raw rows observed for the backfill unit.
      - name: rows_valid
        description: Valid rows observed for the backfill unit.
      - name: rows_rejected
        description: Rejected rows observed for the backfill unit.
      - name: source_uri
        description: Landing object URI associated with the no-data outcome.
      - name: recorded_at
        description: Timestamp when the no-data coverage was recorded.
        data_tests:
          - not_null

  - name: int_eod_price_backfill_terminal_coverage
    description: Ingestion-control view of exact-window completed and no-data EOD backfill outcomes.
    config:
      tags:
        - ingestion_control
    columns:
      - name: data_provider
        description: Provider for the covered backfill unit.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - eodhd
      - name: provider_exchange_code
        description: Provider exchange code in the backfill unit key.
        data_tests:
          - not_null
      - name: provider_instrument_code
        description: Provider instrument code in the backfill unit key.
        data_tests:
          - not_null
      - name: from_date
        description: Inclusive start date of the backfill window; null means the provider start parameter was omitted.
      - name: to_date
        description: Inclusive end date of the backfill window.
        data_tests:
          - not_null
      - name: unit_key_hash
        description: Stable hash of the exact backfill unit key.
        data_tests:
          - not_null
      - name: status
        description: Terminal coverage status for the backfill unit.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - completed
                  - no_data
      - name: reason
        description: Domain reason for the terminal coverage outcome.
      - name: rows_raw
        description: Raw rows observed for the backfill unit.
      - name: rows_valid
        description: Valid rows observed for the backfill unit.
      - name: rows_rejected
        description: Rejected rows observed for the backfill unit.
      - name: source_uri
        description: Landing object URI associated with the terminal outcome.
      - name: recorded_at
        description: Timestamp when the terminal coverage was recorded.
        data_tests:
          - not_null

  - name: int_eod_price_provider_instrument_lifecycle
    description: Ingestion-control view describing provider instrument price lifecycle evidence from the latest tradable universe, observed EOD price bounds, and terminal backfill coverage. This model intentionally avoids fundamentals dependencies so daily price promotion can run independently.
    config:
      tags:
        - ingestion_control
    columns:
      - name: instrument_universe_id
        description: Stable provider exchange/instrument key from the latest instrument universe.
        data_tests:
          - not_null
      - name: data_provider
        description: Provider for the instrument lifecycle row.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - eodhd
      - name: provider_exchange_code
        description: Provider exchange code used for price request namespaces.
        data_tests:
          - not_null
      - name: provider_instrument_code
        description: Provider instrument code evaluated for price lifecycle evidence.
        data_tests:
          - not_null
      - name: expected_price_start_date
        description: First date from which the coverage model can normally expect prices; provider listing or fund inception dates are used when available, otherwise first observed price history, otherwise current date.
        data_tests:
          - not_null
      - name: expected_price_end_date
        description: Last date from which the coverage model can normally expect prices, currently populated from provider delisting dates when supplied.
      - name: provider_lifecycle_start_date
        description: Provider-supplied listing/inception date used as lifecycle evidence when available.
      - name: provider_lifecycle_start_date_source
        description: Provider source field used for the lifecycle start date.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - stock_ipo_date
                  - fund_inception_date
      - name: provider_lifecycle_end_date
        description: Provider-supplied lifecycle end date used as delisting evidence when available.
      - name: provider_lifecycle_end_date_source
        description: Provider source field used for the lifecycle end date.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - stock_delisted_date
      - name: has_fundamental_lifecycle_dates
        description: True when provider fundamentals supplied an IPO, fund inception, or delisting date.
        data_tests:
          - not_null
      - name: has_provider_lifecycle_evidence
        description: True when provider fundamentals, observed prices, or terminal backfill coverage prove provider lifecycle behavior for this instrument.
        data_tests:
          - not_null
      - name: lifecycle_evidence_source
        description: Dominant evidence used to explain provider instrument lifecycle expectedness.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - provider_fundamental_profile
                  - observed_price_history
                  - terminal_no_data
                  - completed_backfill
                  - latest_universe_only
      - name: lifecycle_confidence
        description: Confidence tier for provider lifecycle expectedness.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - provider_fundamental
                  - observed
                  - provider_terminal
                  - unconfirmed

  - name: int_eod_price_expected_instrument_day
    description: Expected EOD price instrument-days for active tradable instruments on open or unknown-calendar exchange dates. Provider lifecycle evidence defines the normal history range, current no-price instruments are expected today, and terminal no-data backfill windows add only their covered date ranges.
    config:
      tags:
        - ingestion_control
    columns:
      - name: expected_instrument_day_id
        description: Stable key for one expected provider instrument/date.
        data_tests:
          - not_null
      - name: data_provider
        description: Provider for the expected price row.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - eodhd
      - name: provider_exchange_code
        description: Provider exchange code used for the price request namespace.
        data_tests:
          - not_null
      - name: provider_instrument_code
        description: Provider instrument code expected to have an EOD price.
        data_tests:
          - not_null
      - name: universe_tier
        description: Provider namespace policy tier carried from the exchange trading-day contract.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - core_v1
                  - watchlist
                  - catalog_only
                  - disabled
      - name: daily_coverage_mode
        description: Daily coverage contract carried from provider namespace policy.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - blocking
                  - monitor_only
                  - none
      - name: historical_coverage_mode
        description: Historical coverage contract carried from provider namespace policy.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - full_assurance
                  - on_demand
                  - none
      - name: is_daily_coverage_blocking
        description: True when this expected instrument-day belongs to a namespace whose latest daily coverage can block a run.
        data_tests:
          - not_null
      - name: instrument_family
        description: Broad dbt instrument classification from the latest instrument universe.
        data_tests:
          - not_null
      - name: bar_date
        description: Local exchange date expected to have a price when the exchange calendar is open.
        data_tests:
          - not_null
      - name: is_calendar_known
        description: True when the provider exchange can be mapped to schedule metadata.
        data_tests:
          - not_null
      - name: is_calendar_coverage_known
        description: True when the mapped holiday calendar covers this local exchange date.
        data_tests:
          - not_null
      - name: has_provider_lifecycle_evidence
        description: True when provider fundamentals, observed prices, or terminal backfill coverage prove provider lifecycle behavior for this instrument.
        data_tests:
          - not_null
      - name: has_fundamental_lifecycle_dates
        description: True when provider fundamentals supplied an IPO, fund inception, or delisting date.
        data_tests:
          - not_null
      - name: provider_lifecycle_start_date
        description: Provider-supplied listing/inception date used as lifecycle evidence when available.
      - name: provider_lifecycle_end_date
        description: Provider-supplied lifecycle end date used as delisting evidence when available.
      - name: is_trading_day
        description: True when the mapped exchange calendar says this date is an open trading day.
        data_tests:
          - not_null

  - name: int_eod_price_instrument_day_coverage
    description: Per-instrument EOD price coverage status for expected instrument-days.
    config:
      tags:
        - ingestion_control
    columns:
      - name: instrument_day_coverage_id
        description: Stable key for one expected provider instrument/date coverage row.
        data_tests:
          - not_null
      - name: data_provider
        description: Provider for the expected price row.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - eodhd
      - name: provider_exchange_code
        description: Provider exchange code used for the price request namespace.
        data_tests:
          - not_null
      - name: provider_instrument_code
        description: Provider instrument code evaluated for EOD price coverage.
        data_tests:
          - not_null
      - name: universe_tier
        description: Provider namespace policy tier carried from the expected instrument-day contract.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - core_v1
                  - watchlist
                  - catalog_only
                  - disabled
      - name: daily_coverage_mode
        description: Daily coverage contract carried from provider namespace policy.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - blocking
                  - monitor_only
                  - none
      - name: historical_coverage_mode
        description: Historical coverage contract carried from provider namespace policy.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - full_assurance
                  - on_demand
                  - none
      - name: is_daily_coverage_blocking
        description: True when this instrument-day belongs to a namespace whose latest daily coverage can block a run.
        data_tests:
          - not_null
      - name: bar_date
        description: Local exchange date evaluated for EOD price coverage.
        data_tests:
          - not_null
      - name: coverage_status
        description: Coverage classification for the expected instrument-day.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - priced
                  - missing_price
                  - known_no_data
                  - unknown_calendar
                  - unknown_calendar_coverage
                  - unknown_instrument_lifecycle
      - name: has_price
        description: True when a staged EOD price row exists for the expected instrument-day.
        data_tests:
          - not_null
      - name: has_no_data_coverage
        description: True when terminal no-data coverage covers this expected instrument-day.
        data_tests:
          - not_null
      - name: has_provider_lifecycle_evidence
        description: True when provider fundamentals, observed prices, or terminal backfill coverage prove provider lifecycle behavior for this instrument.
        data_tests:
          - not_null
      - name: has_fundamental_lifecycle_dates
        description: True when provider fundamentals supplied an IPO, fund inception, or delisting date.
        data_tests:
          - not_null
      - name: provider_lifecycle_start_date
        description: Provider-supplied listing/inception date used as lifecycle evidence when available.
      - name: provider_lifecycle_end_date
        description: Provider-supplied lifecycle end date used as delisting evidence when available.
      - name: is_calendar_coverage_known
        description: True when the mapped holiday calendar covers this local exchange date.
        data_tests:
          - not_null

  - name: int_eod_price_exchange_day_status
    description: Provider exchange/date rollup of expected EOD price coverage.
    config:
      tags:
        - ingestion_control
    columns:
      - name: exchange_day_status_id
        description: Stable key for one provider exchange/date coverage rollup.
        data_tests:
          - not_null
      - name: data_provider
        description: Provider for the exchange-day coverage rollup.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - eodhd
      - name: provider_exchange_code
        description: Provider exchange code evaluated for EOD price coverage.
        data_tests:
          - not_null
      - name: provider_schedule_exchange_code
        description: Provider schedule endpoint code mapped to the EOD price request code, when known.
      - name: exchange_schedule_name
        description: Provider display name for the mapped exchange schedule.
      - name: timezone
        description: IANA timezone for the mapped exchange schedule.
      - name: universe_tier
        description: Provider namespace policy tier carried from the exchange trading-day contract.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - core_v1
                  - watchlist
                  - catalog_only
                  - disabled
      - name: daily_coverage_mode
        description: Daily coverage contract for this provider namespace.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - blocking
                  - monitor_only
                  - none
      - name: historical_coverage_mode
        description: Historical coverage contract for this provider namespace.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - full_assurance
                  - on_demand
                  - none
      - name: is_daily_coverage_blocking
        description: True when latest daily coverage gaps for this namespace should downgrade the run.
        data_tests:
          - not_null
      - name: policy_priority
        description: Provider namespace policy priority; lower numbers are reviewed and ingested first.
      - name: policy_reason
        description: Human-readable reason for the namespace's current policy tier.
      - name: policy_owner
        description: Team or role responsible for reviewing the namespace policy.
      - name: policy_last_reviewed_on
        description: Date when the namespace policy was last reviewed.
      - name: bar_date
        description: Local exchange date evaluated for EOD price coverage.
        data_tests:
          - not_null
      - name: latest_expected_bar_date
        description: Latest local exchange date at or before the build date that should have daily coverage for this provider namespace.
      - name: is_latest_expected_trading_day
        description: True when this row is the latest expected daily coverage date for the namespace.
        data_tests:
          - not_null
      - name: is_calendar_known
        description: True when the provider exchange has a mapped schedule row.
        data_tests:
          - not_null
      - name: is_working_day
        description: True when the date's day name is in the mapped provider working-day expression.
        data_tests:
          - not_null
      - name: is_full_holiday
        description: True when the mapped provider holiday calendar marks the date as a full closure.
        data_tests:
          - not_null
      - name: is_early_close
        description: True when the mapped provider holiday calendar marks the date as an early close.
        data_tests:
          - not_null
      - name: is_trading_day
        description: True when the calendar and holiday coverage are known, the date is a working day, and it is not a full holiday.
        data_tests:
          - not_null
      - name: expected_instruments
        description: Active tradable instruments expected to have coverage for this exchange/date.
        data_tests:
          - not_null
      - name: priced_instruments
        description: Expected instruments with a staged EOD price row.
        data_tests:
          - not_null
      - name: missing_price_instruments
        description: Expected instruments with no staged price and no terminal no-data coverage.
        data_tests:
          - not_null
      - name: known_no_data_instruments
        description: Expected instruments covered by terminal no-data ingestion coverage.
        data_tests:
          - not_null
      - name: unknown_calendar_instruments
        description: Expected instruments whose provider exchange has no known trading calendar mapping.
        data_tests:
          - not_null
      - name: unknown_calendar_coverage_instruments
        description: Expected instruments on a mapped exchange date that sits outside the available holiday calendar coverage horizon.
        data_tests:
          - not_null
      - name: unknown_instrument_lifecycle_instruments
        description: Expected instruments without observed price or terminal backfill evidence proving provider lifecycle behavior.
        data_tests:
          - not_null
      - name: priced_instrument_ratio
        description: Share of expected instruments with staged EOD price rows; null when no instruments are expected.
      - name: exchange_day_status
        description: Rollup status for the exchange/date.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - complete
                  - missing_price
                  - unknown_calendar
                  - unknown_calendar_coverage
                  - unknown_instrument_lifecycle
                  - closed_exchange
                  - no_expected_instruments
      - name: is_blocking_coverage_gap
        description: True when this row should block the daily coverage gate. This is limited to blocking-mode namespaces on their latest expected trading day with an actionable missing or unknown status.
        data_tests:
          - not_null
