version: 2

models:
  - name: int_eod_price_backfill_symbol_status
    description: Ingestion-control view of EODHD provider symbols with completed price coverage ranges.
    config:
      tags:
        - ingestion_control
    columns:
      - name: data_provider
        description: Provider for the eligible backfill symbol.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - eodhd
      - name: provider_exchange_code
        description: Provider exchange code used for the price request namespace.
        data_tests:
          - not_null
      - name: provider_symbol
        description: Exchange-qualified provider symbol, such as AAPL.US.
        data_tests:
          - not_null
      - name: instrument_family
        description: Broad dbt instrument classification from the latest instrument universe.
        data_tests:
          - not_null
      - name: min_bar_date
        description: Earliest completed bar date for the provider symbol, when any price data exists.
      - name: max_bar_date
        description: Latest completed bar date for the provider symbol, when any price data exists.
      - name: bar_count
        description: Number of staged price bars included in the completion range.

  - name: int_eod_price_completion_ranges
    description: Ingestion-control view summarizing completed Bronze price coverage ranges by provider symbol.
    config:
      tags:
        - ingestion_control
    columns:
      - name: data_provider
        description: Provider that supplied the price bars.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - eodhd
      - name: provider_exchange_code
        description: Provider exchange code used for the price ingestion request.
        data_tests:
          - not_null
      - name: provider_symbol
        description: Exchange-qualified provider symbol, such as AAPL.US.
        data_tests:
          - not_null
      - name: min_bar_date
        description: Earliest completed bar date for the provider symbol.
        data_tests:
          - not_null
      - name: max_bar_date
        description: Latest completed bar date for the provider symbol.
        data_tests:
          - not_null
      - name: bar_count
        description: Number of distinct staged price bars included in the range.
        data_tests:
          - not_null

  - name: int_eod_price_backfill_no_data_coverage
    description: Ingestion-control view of exact-range EOD backfill no-data outcomes.
    config:
      tags:
        - ingestion_control
    columns:
      - name: data_provider
        description: Provider for the covered backfill unit.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - eodhd
      - name: provider_exchange_code
        description: Provider exchange code in the backfill unit key.
        data_tests:
          - not_null
      - name: provider_symbol
        description: Exchange-qualified provider symbol in the backfill unit key.
        data_tests:
          - not_null
      - name: from_date
        description: Inclusive start date of the no-data backfill range.
        data_tests:
          - not_null
      - name: to_date
        description: Inclusive end date of the no-data backfill range.
        data_tests:
          - not_null
      - name: unit_key_hash
        description: Stable hash of the exact backfill unit key.
        data_tests:
          - not_null
      - name: reason
        description: Domain reason for the no-data coverage outcome.
      - name: rows_raw
        description: Raw rows observed for the backfill unit.
      - name: rows_valid
        description: Valid rows observed for the backfill unit.
      - name: rows_rejected
        description: Rejected rows observed for the backfill unit.
      - name: source_uri
        description: Landing object URI associated with the no-data outcome.
      - name: recorded_at
        description: Timestamp when the no-data coverage was recorded.
        data_tests:
          - not_null
