version: 2

models:
  - name: int_eod_price_backfill_instrument_status
    description: Ingestion-control view of EODHD provider instruments with completed price coverage ranges.
    config:
      tags:
        - ingestion_control
    columns:
      - name: data_provider
        description: Provider for the eligible backfill instrument.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - eodhd
      - name: provider_exchange_code
        description: Provider exchange code used for the price request namespace.
        data_tests:
          - not_null
      - name: provider_instrument_code
        description: Provider instrument code, such as AAPL.
        data_tests:
          - not_null
      - name: instrument_family
        description: Broad dbt instrument classification from the latest instrument universe.
        data_tests:
          - not_null
      - name: min_bar_date
        description: Earliest completed bar date for the provider instrument, when any price data exists.
      - name: max_bar_date
        description: Latest completed bar date for the provider instrument, when any price data exists.
      - name: bar_count
        description: Number of staged price bars included in the completion range.

  - name: int_eod_price_completion_ranges
    description: Ingestion-control view summarizing completed Bronze price coverage ranges by split provider instrument identity.
    config:
      tags:
        - ingestion_control
    columns:
      - name: data_provider
        description: Provider that supplied the price bars.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - eodhd
      - name: provider_exchange_code
        description: Provider exchange code used for the price ingestion request.
        data_tests:
          - not_null
      - name: provider_instrument_code
        description: Provider instrument code, such as AAPL.
        data_tests:
          - not_null
      - name: min_bar_date
        description: Earliest completed bar date for the provider instrument.
        data_tests:
          - not_null
      - name: max_bar_date
        description: Latest completed bar date for the provider instrument.
        data_tests:
          - not_null
      - name: bar_count
        description: Number of distinct staged price bars included in the range.
        data_tests:
          - not_null

  - name: int_eod_price_backfill_no_data_coverage
    description: Ingestion-control view of exact-range EOD backfill no-data outcomes.
    config:
      tags:
        - ingestion_control
    columns:
      - name: data_provider
        description: Provider for the covered backfill unit.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - eodhd
      - name: provider_exchange_code
        description: Provider exchange code in the backfill unit key.
        data_tests:
          - not_null
      - name: provider_instrument_code
        description: Provider instrument code in the backfill unit key.
        data_tests:
          - not_null
      - name: from_date
        description: Inclusive start date of the no-data backfill range; null means the provider start parameter was omitted.
      - name: to_date
        description: Inclusive end date of the no-data backfill range.
        data_tests:
          - not_null
      - name: unit_key_hash
        description: Stable hash of the exact backfill unit key.
        data_tests:
          - not_null
      - name: reason
        description: Domain reason for the no-data coverage outcome.
      - name: rows_raw
        description: Raw rows observed for the backfill unit.
      - name: rows_valid
        description: Valid rows observed for the backfill unit.
      - name: rows_rejected
        description: Rejected rows observed for the backfill unit.
      - name: source_uri
        description: Landing object URI associated with the no-data outcome.
      - name: recorded_at
        description: Timestamp when the no-data coverage was recorded.
        data_tests:
          - not_null

  - name: int_eod_price_backfill_terminal_coverage
    description: Ingestion-control view of exact-window completed and no-data EOD backfill outcomes.
    config:
      tags:
        - ingestion_control
    columns:
      - name: data_provider
        description: Provider for the covered backfill unit.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - eodhd
      - name: provider_exchange_code
        description: Provider exchange code in the backfill unit key.
        data_tests:
          - not_null
      - name: provider_instrument_code
        description: Provider instrument code in the backfill unit key.
        data_tests:
          - not_null
      - name: from_date
        description: Inclusive start date of the backfill window; null means the provider start parameter was omitted.
      - name: to_date
        description: Inclusive end date of the backfill window.
        data_tests:
          - not_null
      - name: unit_key_hash
        description: Stable hash of the exact backfill unit key.
        data_tests:
          - not_null
      - name: status
        description: Terminal coverage status for the backfill unit.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - completed
                  - no_data
      - name: reason
        description: Domain reason for the terminal coverage outcome.
      - name: rows_raw
        description: Raw rows observed for the backfill unit.
      - name: rows_valid
        description: Valid rows observed for the backfill unit.
      - name: rows_rejected
        description: Rejected rows observed for the backfill unit.
      - name: source_uri
        description: Landing object URI associated with the terminal outcome.
      - name: recorded_at
        description: Timestamp when the terminal coverage was recorded.
        data_tests:
          - not_null
