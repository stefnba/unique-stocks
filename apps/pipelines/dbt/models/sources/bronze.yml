version: 2

sources:
  - name: bronze
    description: Typed Bronze tables written by the Python ingestion app.
    schema: bronze
    tables:
      - name: eod_price
        description: End-of-day OHLCV bars from market data providers.
        columns:
          - name: ingestion_id
            description: Unique ingestion row identifier.
          - name: provider_exchange_code
            description: Provider exchange code for the listed security, used in endpoint paths and ticker suffixes.
          - name: ticker
            description: Exchange-qualified ticker, such as AAPL.US.
          - name: bar_date
            description: Trading date for the OHLCV bar.
          - name: open
            description: Opening price for the trading date.
          - name: high
            description: Highest traded price for the trading date.
          - name: low
            description: Lowest traded price for the trading date.
          - name: close
            description: Closing price for the trading date.
          - name: volume
            description: Reported trading volume for the trading date.
          - name: adjusted_close
            description: Provider-adjusted close price when available.
          - name: data_provider
            description: Provider that supplied the record.
          - name: raw_json
            description: Raw provider payload captured for lineage and replay.
          - name: row_hash
            description: Stable hash of the normalized Bronze row.
          - name: source_uri
            description: S3 URI of the landing object that produced the row.
          - name: ingested_at
            description: Timestamp when the row was written to Bronze.

      - name: exchange_catalog
        description: Provider-supported exchange/API catalog snapshots.
        columns:
          - name: snapshot_date
            description: Date the reference snapshot was ingested.
          - name: provider_exchange_code
            description: Provider exchange code from the provider exchange catalog, not an official MIC.
          - name: name
            description: Exchange display name.
          - name: operating_mic_codes
            description: Official operating MIC value or comma-separated MIC values supplied by the provider.
          - name: country
            description: Exchange country name.
          - name: currency
            description: Primary trading currency for the exchange.
          - name: country_iso2
            description: ISO 3166-1 alpha-2 country code.
          - name: country_iso3
            description: ISO 3166-1 alpha-3 country code.
          - name: data_provider
            description: Provider that supplied the record.
          - name: raw_json
            description: Raw provider payload captured for lineage and replay.
          - name: row_hash
            description: Stable hash of the normalized Bronze row.
          - name: source_uri
            description: S3 URI of the landing object that produced the row.
          - name: ingested_at
            description: Timestamp when the row was written to Bronze.

      - name: exchange_mic_registry
        description: ISO 10383 MIC registry snapshots.
        columns:
          - name: snapshot_date
            description: Date the registry snapshot was ingested.
          - name: mic
            description: Market Identifier Code allocated to the market.
          - name: operating_mic
            description: Operating MIC for this MIC row.
          - name: mic_type
            description: MIC type, either OPRT for operating MICs or SGMT for segment MICs.
          - name: name
            description: Market name or institution description.
          - name: legal_entity_name
            description: Legal name of the entity owning the market.
          - name: lei
            description: Legal Entity Identifier when supplied.
          - name: market_category_code
            description: ISO 10383 market category code.
          - name: acronym
            description: Known market acronym when supplied.
          - name: country_iso2
            description: ISO 3166-1 alpha-2 country code.
          - name: city
            description: City where the market is located.
          - name: website
            description: Market website when supplied.
          - name: status
            description: Registry lifecycle status.
          - name: creation_date
            description: Date the MIC was originally created.
          - name: last_update_date
            description: Date the MIC was last modified.
          - name: last_validation_date
            description: Date the MIC was last reviewed for correctness.
          - name: expiry_date
            description: Date the MIC was deactivated, when applicable.
          - name: comments
            description: Registry comments supplied by the source.
          - name: data_provider
            description: Provider that supplied the record.
          - name: raw_json
            description: Raw provider payload captured for lineage and replay.
          - name: row_hash
            description: Stable hash of the normalized Bronze row.
          - name: source_uri
            description: S3 URI of the landing object that produced the row.
          - name: ingested_at
            description: Timestamp when the row was written to Bronze.

      - name: exchange_schedule
        description: Trading-hours snapshots from provider schedule endpoints.
        columns:
          - name: snapshot_date
            description: Date the schedule snapshot was ingested.
          - name: provider_schedule_exchange_code
            description: Provider schedule endpoint code; not guaranteed to be an official MIC.
          - name: name
            description: Exchange display name from the v2 response.
          - name: timezone
            description: IANA timezone for the exchange schedule.
          - name: session_open
            description: Regular session open time in local exchange time.
          - name: session_close
            description: Regular session close time in local exchange time.
          - name: working_days
            description: Trading days supplied by the provider.
          - name: pre_market_open
            description: Pre-market open time when available.
          - name: pre_market_close
            description: Pre-market close time when available.
          - name: after_hours_open
            description: After-hours open time when available.
          - name: after_hours_close
            description: After-hours close time when available.
          - name: lunch_break_start
            description: Lunch-break start time when available.
          - name: lunch_break_end
            description: Lunch-break end time when available.
          - name: data_provider
            description: Provider that supplied the record.
          - name: raw_json
            description: Raw provider payload captured for lineage and replay.
          - name: row_hash
            description: Stable hash of the normalized Bronze row.
          - name: source_uri
            description: S3 URI of the landing object that produced the row.
          - name: ingested_at
            description: Timestamp when the row was written to Bronze.

      - name: exchange_holiday
        description: Exchange holiday snapshots from provider schedule endpoints.
        columns:
          - name: snapshot_date
            description: Date the holiday snapshot was ingested.
          - name: provider_schedule_exchange_code
            description: Provider schedule endpoint code; not guaranteed to be an official MIC.
          - name: holiday_date
            description: Holiday date in the exchange calendar.
          - name: holiday_name
            description: Holiday display name supplied by the provider.
          - name: holiday_type
            description: Provider holiday type, such as Official, Bank, or EarlyClose.
          - name: early_close_time
            description: Early close time when the holiday type is EarlyClose.
          - name: data_provider
            description: Provider that supplied the record.
          - name: raw_json
            description: Raw provider payload captured for lineage and replay.
          - name: row_hash
            description: Stable hash of the normalized Bronze row.
          - name: source_uri
            description: S3 URI of the landing object that produced the row.
          - name: ingested_at
            description: Timestamp when the row was written to Bronze.

      - name: instrument
        description: Tradable instrument reference snapshots from market data providers.
        columns:
          - name: snapshot_date
            description: Date the reference snapshot was ingested.
          - name: provider_exchange_code
            description: Provider exchange code used for the instrument-list request.
          - name: ticker
            description: Provider ticker symbol.
          - name: name
            description: Instrument display name.
          - name: country
            description: Instrument country when available.
          - name: provider_listing_exchange_code
            description: Provider exchange-like code returned on the individual instrument row, when available.
          - name: currency
            description: Instrument trading currency when available.
          - name: asset_type
            description: Provider asset type classification.
          - name: isin
            description: International Securities Identification Number when available.
          - name: data_provider
            description: Provider that supplied the record.
          - name: raw_json
            description: Raw provider payload captured for lineage and replay.
          - name: row_hash
            description: Stable hash of the normalized Bronze row.
          - name: source_uri
            description: S3 URI of the landing object that produced the row.
          - name: ingested_at
            description: Timestamp when the row was written to Bronze.

      - name: fundamental_document
        description: Fundamentals document snapshots with stable metadata and full provider payloads in raw_json.
        columns:
          - name: ingestion_id
            description: Unique ingestion row identifier.
          - name: snapshot_date
            description: Date the fundamentals document snapshot was ingested.
          - name: provider_exchange_code
            description: Provider exchange code from the exchange-qualified ticker.
          - name: ticker
            description: Exchange-qualified ticker requested from the fundamentals endpoint.
          - name: code
            description: Provider ticker code without exchange suffix.
          - name: name
            description: Instrument display name from the fundamentals General section.
          - name: instrument_type
            description: Provider instrument type from the fundamentals General section.
          - name: instrument_family
            description: Stable broad instrument family derived from the provider instrument type.
          - name: primary_ticker
            description: Provider primary ticker when supplied.
          - name: provider_listing_exchange_code
            description: Provider listing exchange value from the fundamentals General section.
          - name: provider_updated_at
            description: Provider-reported date when the fundamentals document was updated.
          - name: top_level_sections
            description: Top-level JSON sections present in the provider payload.
          - name: payload_hash
            description: Stable hash of the canonical provider fundamentals document.
          - name: data_provider
            description: Provider that supplied the record.
          - name: raw_json
            description: Raw provider payload captured for lineage and replay.
          - name: row_hash
            description: Stable hash of the normalized Bronze row.
          - name: source_uri
            description: S3 URI of the landing object that produced the row.
          - name: ingested_at
            description: Timestamp when the row was written to Bronze.

      - name: fundamental_stock_identity
        description: Stock-specific identity snapshots parsed from fundamentals documents.
        columns:
          - name: ingestion_id
            description: Unique ingestion row identifier.
          - name: snapshot_date
            description: Date the stock identity snapshot was ingested.
          - name: provider_exchange_code
            description: Provider exchange code from the exchange-qualified ticker.
          - name: ticker
            description: Exchange-qualified ticker requested from the fundamentals endpoint.
          - name: code
            description: Provider ticker code without exchange suffix.
          - name: name
            description: Stock display name.
          - name: primary_ticker
            description: Provider primary ticker when supplied.
          - name: provider_listing_exchange_code
            description: Provider listing exchange value from the fundamentals General section.
          - name: currency_code
            description: Trading or reporting currency code from the provider.
          - name: currency_name
            description: Currency display name from the provider.
          - name: country_name
            description: Issuer country name from the provider.
          - name: country_iso
            description: Issuer country ISO code from the provider.
          - name: isin
            description: International Securities Identification Number when supplied.
          - name: cusip
            description: Committee on Uniform Securities Identification Procedures identifier when supplied.
          - name: cik
            description: SEC Central Index Key when supplied.
          - name: lei
            description: Legal Entity Identifier when supplied.
          - name: open_figi
            description: OpenFIGI identifier when supplied.
          - name: employer_id_number
            description: Employer Identification Number when supplied.
          - name: fiscal_year_end
            description: Fiscal year-end month or label from the provider.
          - name: ipo_date
            description: Initial public offering date when supplied.
          - name: sector
            description: Provider sector classification.
          - name: industry
            description: Provider industry classification.
          - name: gic_sector
            description: GICS sector classification when supplied.
          - name: gic_group
            description: GICS group classification when supplied.
          - name: gic_industry
            description: GICS industry classification when supplied.
          - name: gic_sub_industry
            description: GICS sub-industry classification when supplied.
          - name: home_category
            description: Provider domestic or ADR classification when supplied.
          - name: is_delisted
            description: Whether the provider marks the stock as delisted.
          - name: delisted_date
            description: Delisting date when supplied.
          - name: full_time_employees
            description: Reported number of full-time employees when supplied.
          - name: web_url
            description: Company website URL when supplied.
          - name: logo_url
            description: Provider logo path or URL when supplied.
          - name: data_provider
            description: Provider that supplied the record.
          - name: raw_json
            description: Raw provider payload fragment captured for lineage and replay.
          - name: row_hash
            description: Stable hash of the normalized Bronze row.
          - name: source_uri
            description: S3 URI of the landing object that produced the row.
          - name: ingested_at
            description: Timestamp when the row was written to Bronze.

      - name: fundamental_statement_fact
        description: Long-form stock financial-statement facts parsed from fundamentals documents.
        columns:
          - name: ingestion_id
            description: Unique ingestion row identifier.
          - name: snapshot_date
            description: Date the statement fact snapshot was ingested.
          - name: provider_exchange_code
            description: Provider exchange code from the exchange-qualified ticker.
          - name: ticker
            description: Exchange-qualified ticker requested from the fundamentals endpoint.
          - name: statement_type
            description: Statement family such as balance_sheet, cash_flow, or income_statement.
          - name: period_type
            description: Reporting cadence, either annual or quarterly.
          - name: period_end_date
            description: Financial reporting period end date.
          - name: filing_date
            description: Filing date associated with the report when supplied.
          - name: currency_symbol
            description: Statement currency symbol when supplied by the provider.
          - name: metric_name
            description: Provider metric name from the financial statement payload.
          - name: metric_value
            description: Numeric value of the statement metric.
          - name: data_provider
            description: Provider that supplied the record.
          - name: raw_json
            description: Raw provider payload fragment captured for lineage and replay.
          - name: row_hash
            description: Stable hash of the normalized Bronze row.
          - name: source_uri
            description: S3 URI of the landing object that produced the row.
          - name: ingested_at
            description: Timestamp when the row was written to Bronze.

      - name: fundamental_stock_earnings_fact
        description: Long-form stock earnings facts parsed from fundamentals Annual, History, and Trend sections.
        columns:
          - name: ingestion_id
            description: Unique ingestion row identifier.
          - name: snapshot_date
            description: Date the earnings fact snapshot was ingested.
          - name: provider_exchange_code
            description: Provider exchange code from the exchange-qualified ticker.
          - name: ticker
            description: Exchange-qualified ticker requested from the fundamentals endpoint.
          - name: earnings_section
            description: Provider earnings subsection, such as annual, history, or trend.
          - name: period_type
            description: Reporting cadence when explicit in the provider payload, such as annual or quarterly.
          - name: fiscal_period_end
            description: Fiscal period end date associated with the earnings metric.
          - name: report_date
            description: Earnings report date when supplied by the provider.
          - name: before_after_market
            description: Provider timing label for the earnings announcement when supplied.
          - name: currency_code
            description: Currency code supplied with the earnings history row when available.
          - name: fiscal_quarter
            description: Provider fiscal quarter label when supplied.
          - name: period_offset
            description: Provider relative period label such as +1q or +1y when supplied.
          - name: metric_name
            description: Provider metric name from the earnings payload.
          - name: metric_value
            description: Numeric value of the earnings metric.
          - name: data_provider
            description: Provider that supplied the record.
          - name: raw_json
            description: Raw provider payload fragment captured for lineage and replay.
          - name: row_hash
            description: Stable hash of the normalized Bronze row.
          - name: source_uri
            description: S3 URI of the landing object that produced the row.
          - name: ingested_at
            description: Timestamp when the row was written to Bronze.

      - name: fundamental_stock_shares_stats
        description: Stock share-statistics snapshots parsed from the fundamentals SharesStats section.
        columns:
          - name: ingestion_id
            description: Unique ingestion row identifier.
          - name: snapshot_date
            description: Date the share-statistics snapshot was ingested.
          - name: provider_exchange_code
            description: Provider exchange code from the exchange-qualified ticker.
          - name: ticker
            description: Exchange-qualified ticker requested from the fundamentals endpoint.
          - name: shares_outstanding
            description: Provider-reported shares outstanding.
          - name: shares_float
            description: Provider-reported float shares.
          - name: percent_insiders
            description: Provider-reported percentage held by insiders.
          - name: percent_institutions
            description: Provider-reported percentage held by institutions.
          - name: shares_short
            description: Provider-reported shares sold short when supplied.
          - name: shares_short_prior_month
            description: Provider-reported shares sold short in the prior month when supplied.
          - name: short_ratio
            description: Provider-reported short ratio when supplied.
          - name: short_percent_outstanding
            description: Provider-reported short interest as a percentage of outstanding shares.
          - name: short_percent_float
            description: Provider-reported short interest as a percentage of float shares.
          - name: data_provider
            description: Provider that supplied the record.
          - name: raw_json
            description: Raw provider payload fragment captured for lineage and replay.
          - name: row_hash
            description: Stable hash of the normalized Bronze row.
          - name: source_uri
            description: S3 URI of the landing object that produced the row.
          - name: ingested_at
            description: Timestamp when the row was written to Bronze.

      - name: fundamental_stock_outstanding_shares
        description: Historical stock outstanding-share observations parsed from fundamentals outstandingShares.
        columns:
          - name: ingestion_id
            description: Unique ingestion row identifier.
          - name: snapshot_date
            description: Date the outstanding-shares snapshot was ingested.
          - name: provider_exchange_code
            description: Provider exchange code from the exchange-qualified ticker.
          - name: ticker
            description: Exchange-qualified ticker requested from the fundamentals endpoint.
          - name: period_type
            description: Provider period family, either annual or quarterly.
          - name: provider_period_label
            description: Provider period label such as 2026 or 2026-Q1.
          - name: period_end_date
            description: Period end date supplied or inferred from the provider period label.
          - name: shares_mln
            description: Provider-reported shares outstanding in millions.
          - name: shares
            description: Provider-reported shares outstanding.
          - name: data_provider
            description: Provider that supplied the record.
          - name: raw_json
            description: Raw provider payload fragment captured for lineage and replay.
          - name: row_hash
            description: Stable hash of the normalized Bronze row.
          - name: source_uri
            description: S3 URI of the landing object that produced the row.
          - name: ingested_at
            description: Timestamp when the row was written to Bronze.

      - name: fundamental_stock_holder
