        columns:
          - name: ingestion_id
            description: Unique ingestion row identifier.
          - name: snapshot_date
            description: Date the holder snapshot was ingested.
          - name: provider_exchange_code
            description: Provider exchange code from the exchange-qualified ticker.
          - name: ticker
            description: Exchange-qualified ticker requested from the fundamentals endpoint.
          - name: holder_type
            description: Holder category, such as institution or fund.
          - name: provider_position
            description: Provider order position within the holder category.
          - name: holder_name
            description: Holder display name supplied by the provider.
          - name: report_date
            description: Provider-reported holder date.
          - name: total_shares_percent
            description: Provider-reported holder percentage of shares.
          - name: total_assets_percent
            description: Provider-reported percentage of holder assets in the stock.
          - name: current_shares
            description: Provider-reported current shares held.
          - name: shares_change
            description: Provider-reported share change.
          - name: shares_change_percent
            description: Provider-reported percentage share change.
          - name: data_provider
            description: Provider that supplied the record.
          - name: raw_json
            description: Raw provider payload fragment captured for lineage and replay.
          - name: row_hash
            description: Stable hash of the normalized Bronze row.
          - name: source_uri
            description: S3 URI of the landing object that produced the row.
          - name: ingested_at
            description: Timestamp when the row was written to Bronze.

      - name: fundamental_stock_insider_transaction
        description: Stock insider transaction rows parsed from fundamentals InsiderTransactions.
        columns:
          - name: ingestion_id
            description: Unique ingestion row identifier.
          - name: snapshot_date
            description: Date the insider transaction snapshot was ingested.
          - name: provider_exchange_code
            description: Provider exchange code from the exchange-qualified ticker.
          - name: ticker
            description: Exchange-qualified ticker requested from the fundamentals endpoint.
          - name: provider_position
            description: Provider order position within the InsiderTransactions map.
          - name: filing_date
            description: Provider filing date for the insider transaction row.
          - name: owner_cik
            description: Insider owner CIK when supplied.
          - name: owner_name
            description: Insider owner display name supplied by the provider.
          - name: transaction_date
            description: Date the insider transaction occurred.
          - name: transaction_code
            description: Provider transaction code, such as P for purchase or S for sale.
          - name: transaction_amount
            description: Provider-reported transaction share amount.
          - name: transaction_price
            description: Provider-reported transaction price.
          - name: transaction_acquired_disposed
            description: Provider acquired or disposed flag, usually A or D.
          - name: post_transaction_amount
            description: Provider-reported post-transaction share amount.
          - name: sec_link
            description: SEC filing link supplied by the provider.
          - name: data_provider
            description: Provider that supplied the record.
          - name: raw_json
            description: Raw provider payload fragment captured for lineage and replay.
          - name: row_hash
