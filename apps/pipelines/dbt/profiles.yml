unique_stocks:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', env_var('LOCAL_LAKE_PATH', env_var('LAKE_NAME', 'unique_stocks') ~ '.duckdb')) }}"
      schema: main
      threads: 4
    prod:
      type: duckdb
      path: "md:{{ env_var('LAKE_NAME') }}?motherduck_token={{ env_var('MOTHERDUCK_TOKEN') }}"
      schema: main
      threads: 4
