# Docker-based local development overrides.
# Prefect UI: http://localhost:4200
# Copy apps/pipelines/.env.example → apps/pipelines/.env and fill in secrets before starting.

services:
  pipelines-server:
    ports:
      - "4200:4200"
    environment:
      # Browser-facing URL — must match what you open in the browser
      PREFECT_UI_API_URL: http://localhost:4200/api
    restart: unless-stopped

  pipelines-db:
    restart: unless-stopped

  pipelines-worker:
    env_file:
      - path: ../.env
        required: false # cp .env.example .env to start
    environment:
      ENVIRONMENT: docker_dev
      LAKE_NAME: unique_stocks
      LOCAL_LAKE_PATH: /app/lake-data/unique_stocks.duckdb
      PIPELINE_LOG_FORMAT: console
      PIPELINE_LOG_LEVEL: INFO
    restart: unless-stopped
    volumes:
      - pipelines-lake:/app/lake-data

  pipelines-migrator:
    env_file:
      - path: ../.env
        required: false
    environment:
      ENVIRONMENT: docker_dev
      LAKE_NAME: unique_stocks
      LOCAL_LAKE_PATH: /app/lake-data/unique_stocks.duckdb
      PIPELINE_LOG_FORMAT: console
      PIPELINE_LOG_LEVEL: INFO
    volumes:
      - pipelines-lake:/app/lake-data

  pipelines-operational-health:
    env_file:
      - path: ../.env
        required: false
    environment:
      ENVIRONMENT: docker_dev
      LAKE_NAME: unique_stocks
      LOCAL_LAKE_PATH: /app/lake-data/unique_stocks.duckdb
      PIPELINE_LOG_FORMAT: console
      PIPELINE_LOG_LEVEL: INFO
      OPERATIONAL_HEALTH_RECENT_DOMAINS: ${OPERATIONAL_HEALTH_RECENT_DOMAINS:-}
      OPERATIONAL_HEALTH_RECENT_HOURS: ${OPERATIONAL_HEALTH_RECENT_HOURS:-36}
      OPERATIONAL_HEALTH_STALE_RUNNING_HOURS: ${OPERATIONAL_HEALTH_STALE_RUNNING_HOURS:-2}
      OPERATIONAL_HEALTH_LAKE_READ_ONLY: ${OPERATIONAL_HEALTH_LAKE_READ_ONLY:-auto}
    restart: unless-stopped
    volumes:
      - pipelines-lake:/app/lake-data

  pipelines-dashboard:
    env_file:
      - path: ../.env
        required: false
    ports:
      - "8501:8501"
    environment:
      ENVIRONMENT: docker_dev
      EODHD_API_KEY: ""
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      LAKE_NAME: unique_stocks
      LOCAL_LAKE_PATH: /app/lake-data/unique_stocks.duckdb
      PREFECT_UI_URL: http://localhost:4200
    restart: unless-stopped
    volumes:
      - pipelines-lake:/app/lake-data
