# Base service definitions — no environment-specific values.
# Never use directly. Compose with an override:
#   docker compose -f .../docker-compose.yml -f .../docker-compose.dev.yml ...
# Use make infra-* targets from the repo root.

name: unique-stocks

x-pipelines-worker-build: &pipelines-worker-build
  context: ..
  dockerfile: deploy/Dockerfile
  args:
    GIT_SHA: ${GIT_SHA:-}

x-pipelines-runtime-environment: &pipelines-runtime-environment
  PREFECT_API_URL: http://pipelines-server:4200/api
  PREFECT_WORK_DIR: /app
  PREFECT_WORKER_LIMIT: ${PREFECT_WORKER_LIMIT:-1}
  PREFECT_NOTIFICATION_BLOCK_ID: ${PREFECT_NOTIFICATION_BLOCK_ID:-}
  PREFECT_LOGGING_EXTRA_LOGGERS: core,domains,providers,config,scripts
  PREFECT_LOGGING_LOG_PRINTS: "False"
  GIT_SHA: ${GIT_SHA:-}

services:
  # ── Prefect server (API + UI) ──────────────────────────────────────────────
  pipelines-server:
    image: prefecthq/prefect:3.7.0-python3.14
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_SERVER_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:${POSTGRES_PASSWORD:-prefect}@pipelines-db:5432/prefect
    depends_on:
      pipelines-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ── Postgres (Prefect persistence) ────────────────────────────────────────
  pipelines-db:
    image: postgres:17
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prefect}
      POSTGRES_DB: prefect
    volumes:
      - prefect-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Pipelines worker ───────────────────────────────────────────────────────
  pipelines-migrator:
    build: *pipelines-worker-build
    environment:
      <<: *pipelines-runtime-environment
    command:
      [
        "uv",
        "run",
        "--no-dev",
        "--frozen",
        "python",
        "-m",
        "core.lake.migration.migrate",
        "--migrations-dir",
        "lake/migrations",
      ]
    restart: "no"

  pipelines-worker:
    build: *pipelines-worker-build
    environment:
      <<: *pipelines-runtime-environment
    depends_on:
      pipelines-server:
        condition: service_healthy
      pipelines-migrator:
        condition: service_completed_successfully
    command:
      [
        "sh",
        "-c",
        "uv run --no-dev --frozen prefect worker start --pool default-process-pool --limit $${PREFECT_WORKER_LIMIT:-1}",
      ]
    healthcheck:
      test: ["CMD", "uv", "run", "--no-dev", "--frozen", "python", "scripts/health/check_worker.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── Operational health monitor ────────────────────────────────────────────
  pipelines-operational-health:
    build: *pipelines-worker-build
    environment:
      <<: *pipelines-runtime-environment
      OPERATIONAL_HEALTH_RECENT_DOMAINS: ${OPERATIONAL_HEALTH_RECENT_DOMAINS:-}
      OPERATIONAL_HEALTH_RECENT_HOURS: ${OPERATIONAL_HEALTH_RECENT_HOURS:-36}
      OPERATIONAL_HEALTH_STALE_RUNNING_HOURS: ${OPERATIONAL_HEALTH_STALE_RUNNING_HOURS:-2}
      OPERATIONAL_HEALTH_LAKE_READ_ONLY: ${OPERATIONAL_HEALTH_LAKE_READ_ONLY:-auto}
    depends_on:
      pipelines-server:
        condition: service_healthy
      pipelines-migrator:
        condition: service_completed_successfully
    command: ["tail", "-f", "/dev/null"]
    healthcheck:
      test: ["CMD", "uv", "run", "--no-dev", "--frozen", "python", "scripts/health/check_operational.py"]
      interval: 300s
      timeout: 30s
      retries: 2
      start_period: 120s

  # ── Pipeline audit dashboard ──────────────────────────────────────────────
  pipelines-dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dashboard
      args:
        GIT_SHA: ${GIT_SHA:-}
    environment:
      PREFECT_API_URL: http://pipelines-server:4200/api
      PREFECT_WORK_DIR: /app
      PREFECT_UI_URL: ${PREFECT_UI_URL:-}
      GIT_SHA: ${GIT_SHA:-}
    depends_on:
      pipelines-server:
        condition: service_healthy

volumes:
  prefect-db:
  pipelines-lake:
