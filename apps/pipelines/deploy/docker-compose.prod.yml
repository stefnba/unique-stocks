# Production overrides.
# Secrets are injected by the deployment platform (Coolify) — never commit real values here.

services:

  pipelines-server:
    ports:
      - "${PREFECT_HOST_BIND_IP:-127.0.0.1}:4200:4200"
    environment:
      # Set to the public-facing URL of your Prefect deployment
      PREFECT_UI_API_URL: ${PREFECT_UI_API_URL}
      PREFECT_SERVER_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}@pipelines-db:5432/prefect
    restart: always

  pipelines-db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}
    restart: always

  pipelines-migrator:
    environment:
      ENVIRONMENT: prod
      MOTHERDUCK_TOKEN: ${MOTHERDUCK_TOKEN:?MOTHERDUCK_TOKEN is required in production}
      PIPELINE_LOG_FORMAT: json
      PIPELINE_LOG_LEVEL: INFO
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  pipelines-worker:
    environment:
      ENVIRONMENT: prod
      MOTHERDUCK_TOKEN: ${MOTHERDUCK_TOKEN:?MOTHERDUCK_TOKEN is required in production}
      PIPELINE_LOG_FORMAT: json
      PIPELINE_LOG_LEVEL: INFO
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512m

  pipelines-operational-health:
    environment:
      ENVIRONMENT: prod
      MOTHERDUCK_TOKEN: ${MOTHERDUCK_TOKEN:?MOTHERDUCK_TOKEN is required in production}
      PIPELINE_LOG_FORMAT: json
      PIPELINE_LOG_LEVEL: INFO
      OPERATIONAL_HEALTH_RECENT_DOMAINS: ${OPERATIONAL_HEALTH_RECENT_DOMAINS:-}
      OPERATIONAL_HEALTH_RECENT_HOURS: ${OPERATIONAL_HEALTH_RECENT_HOURS:-36}
      OPERATIONAL_HEALTH_STALE_RUNNING_HOURS: ${OPERATIONAL_HEALTH_STALE_RUNNING_HOURS:-2}
      OPERATIONAL_HEALTH_LAKE_READ_ONLY: ${OPERATIONAL_HEALTH_LAKE_READ_ONLY:-auto}
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256m

  pipelines-dashboard:
    ports:
      - "${DASHBOARD_HOST_BIND_IP:-127.0.0.1}:8501:8501"
    environment:
      ENVIRONMENT: prod
      MOTHERDUCK_TOKEN: ${MOTHERDUCK_TOKEN:?MOTHERDUCK_TOKEN is required in production}
      DASHBOARD_MOTHERDUCK_TOKEN: ${DASHBOARD_MOTHERDUCK_TOKEN:-}
      PREFECT_UI_URL: ${PREFECT_UI_URL:-}
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512m
