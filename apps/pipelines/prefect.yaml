# Prefect deployment configuration for the unique-stocks pipelines app.
#
# Deploy all:        uv run prefect deploy --all
# Deploy one:        uv run prefect deploy --name eod-price/daily
# Dry-run (no push): uv run prefect deploy --all --no-prompt
#
# Workers read PREFECT_API_URL from the environment (.env / docker-compose).
# The pull step uses PREFECT_WORK_DIR so both local dev (.) and Docker (/app)
# work without changing this file.

prefect-version: "3.7.0"
name: unique-stocks-pipelines

# ---------------------------------------------------------------------------
# Build / push
# ---------------------------------------------------------------------------
# Code ships inside the Docker image — no build or push steps needed here.
# The Coolify deployment pipeline handles image builds separately.
build: null
push: null

# ---------------------------------------------------------------------------
# Pull (runs on the worker before each flow run)
# ---------------------------------------------------------------------------
# PREFECT_WORK_DIR:
#   Docker / Coolify  → /app   (set in docker-compose)
#   Local dev         → .      (set in shell or .env)
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: "{{ $PREFECT_WORK_DIR }}"

# ---------------------------------------------------------------------------
# Shared definitions (YAML anchors — not a Prefect concept, just YAML)
# ---------------------------------------------------------------------------
definitions:
  work_pool: &default_pool
    name: default-process-pool
    work_queue_name: default

  # Paused stub used for domains that are not yet implemented.
  # Registered in the UI so the full domain list is visible, but will not run.
  stub_deployment: &stub
    paused: true
    work_pool: *default_pool

# ---------------------------------------------------------------------------
# Deployments
# ---------------------------------------------------------------------------
deployments:
  # ── EOD price — daily scheduled run ──────────────────────────────────────
  - name: daily
    description: >
      Ingest end-of-day OHLCV price for all configured provider exchange codes.
      Pass provider_exchange_codes to restrict a manual run to a subset such as US equities.
    entrypoint: domains.eod_price.flows:eod_price_flow
    tags:
      - eod-price
      - scheduled
    schedule:
      cron: "30 16 * * 1-5" # 4:30pm — interpreted in America/New_York (Prefect handles DST)
      timezone: America/New_York
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW # a late trigger should not stack on a running one
    enforce_parameter_schema: true
    work_pool: *default_pool

  # ── EOD price — manual date backfill (single day via bulk endpoint) ───────
  - name: backfill
    description: >
      Manually backfill EOD price for a specific trade_date using the bulk endpoint.
      Trigger from the UI or CLI: prefect deployment run 'eod-price-daily/backfill' -p trade_date=2026-01-15
    entrypoint: domains.eod_price.flows:eod_price_flow
    tags:
      - eod-price
      - backfill
    parameters:
      trade_date: null
    enforce_parameter_schema: true
    work_pool: *default_pool

  # ── EOD price — historical backfill (per-ticker, multi-day range) ─────────
  - name: historical-backfill
    description: >
      Full historical EOD backfill for all instrument using the per-ticker endpoint.
      One API call per instrument regardless of date range length.
      Pass provider_exchange_codes to restrict to a subset (e.g. ["LSE"]).
    entrypoint: domains.eod_price.flows:eod_price_backfill_flow
    tags:
      - eod-price
      - backfill
    parameters:
      from_date: null
      to_date: null
      provider_exchange_codes: null
      batch_size: 50
    enforce_parameter_schema: true
    work_pool: *default_pool

  # ── dbt — transform current price models ─────────────────────────────────
  - name: exchange-build
    flow_name: dbt-build
    description: >
      Run dbt build for exchange staging and intermediate models, including
      the provider ingestion universe consumed by instrument and price flows.
    entrypoint: core.transforms.dbt:dbt_build_flow
    tags:
      - dbt
      - transform
      - exchange
    parameters:
      command: build
      select:
        - eodhd_provider_namespaces
        - path:models/staging/exchange
        - path:models/intermediate/exchange
      exclude: null
      project_dir: dbt
      profiles_dir: dbt
      target: null
      parent_run_id: null
    enforce_parameter_schema: true
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    work_pool: *default_pool

  - name: price-build
    flow_name: dbt-build
    description: >
      Run dbt build for current price staging and mart models, then persist
      run_results.json into pipeline audit tables.
    entrypoint: core.transforms.dbt:dbt_build_flow
    tags:
      - dbt
      - transform
      - price
    parameters:
      command: build
      select:
        - path:models/staging/price
        - path:models/marts/price
      exclude: null
      project_dir: dbt
      profiles_dir: dbt
      target: null
      parent_run_id: null
    enforce_parameter_schema: true
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    work_pool: *default_pool

  # ── Exchange — manual / monthly refresh ─────────────────────────────────
  - name: catalog-refresh
    flow_name: exchange-catalog-refresh
    description: >
      Refresh the list of provider-supported exchange catalog codes.
      Run manually or on a monthly schedule once implemented.
    entrypoint: domains.exchange.flows:exchange_catalog_flow
    tags:
      - exchange
      - stub
    <<: *stub

  - name: mic-registry-refresh
    flow_name: exchange-mic-registry-refresh
    description: >
      Refresh the ISO 10383 MIC registry snapshot.
      Run manually or on a monthly schedule once implemented.
    entrypoint: domains.exchange.flows:exchange_mic_registry_flow
    tags:
      - exchange
      - stub
    <<: *stub

  # ── Exchange schedule — manual / monthly refresh ───────────────────────────
  - name: schedule-refresh
    flow_name: exchange-schedule-refresh
    description: >
      Refresh trading hours and holiday for all exchange supported by the
      configured provider schedule API (endpoint-specific provider schedule codes).
    entrypoint: domains.exchange_schedule.flows:exchange_schedule_flow
    tags:
      - exchange
      - schedule
    parameters:
      snapshot_date: null
      provider_schedule_exchange_codes: null
    enforce_parameter_schema: true
    work_pool: *default_pool

  # ── Instrument — weekly refresh ──────────────────────────────────────────
  - name: weekly
    flow_name: instrument-refresh
    description: >
      Refresh active instrument across provider exchange codes, including equities,
      ETFs, funds, FX, crypto, bonds, and other provider-supported asset classes.
      Scheduled for Monday 8am ET when activated.
    entrypoint: domains.instrument.flows:instrument_flow
    tags:
      - instrument
      - stub
    schedule:
      cron: "0 8 * * 1"
      timezone: America/New_York
    <<: *stub

  # ── Fundamental — quarterly ───────────────────────────────────────────────
  - name: quarterly
    flow_name: fundamental-quarterly
    description: >
      Ingest income statements, balance sheets, and ratios from the configured provider.
      Manually triggered during earnings season once implemented.
    entrypoint: domains.fundamental.flows:fundamental_flow
    tags:
      - fundamental
      - stub
    <<: *stub
