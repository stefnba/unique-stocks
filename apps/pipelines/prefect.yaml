# Prefect deployment configuration for the unique-stocks pipelines app.
#
# Deploy all:        uv run prefect deploy --all
# Deploy one:        uv run prefect deploy --name eod-prices/daily
# Dry-run (no push): uv run prefect deploy --all --no-prompt
#
# Workers read PREFECT_API_URL from the environment (.env / docker-compose).
# The pull step uses PREFECT_WORK_DIR so both local dev (.) and Docker (/app)
# work without changing this file.

prefect-version: "3.7.0"
name: unique-stocks-pipelines

# ---------------------------------------------------------------------------
# Build / push
# ---------------------------------------------------------------------------
# Code ships inside the Docker image — no build or push steps needed here.
# The Coolify deployment pipeline handles image builds separately.
build: null
push: null

# ---------------------------------------------------------------------------
# Pull (runs on the worker before each flow run)
# ---------------------------------------------------------------------------
# PREFECT_WORK_DIR:
#   Docker / Coolify  → /app   (set in docker-compose)
#   Local dev         → .      (set in shell or .env)
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: "{{ $PREFECT_WORK_DIR }}"

# ---------------------------------------------------------------------------
# Shared definitions (YAML anchors — not a Prefect concept, just YAML)
# ---------------------------------------------------------------------------
definitions:
  work_pool: &default_pool
    name: default-process-pool
    work_queue_name: default

  # Paused stub used for domains that are not yet implemented.
  # Registered in the UI so the full domain list is visible, but will not run.
  stub_deployment: &stub
    paused: true
    work_pool: *default_pool

# ---------------------------------------------------------------------------
# Deployments
# ---------------------------------------------------------------------------
deployments:

  # ── EOD prices — daily scheduled run ──────────────────────────────────────
  - name: daily
    description: >
      Ingest end-of-day OHLCV prices for all configured EODHD exchanges.
      Pass exchange_codes to restrict a manual run to a subset such as US equities.
    entrypoint: domains.eod_prices.flows:eod_prices_flow
    tags:
      - eod-prices
      - scheduled
    schedule:
      cron: "30 16 * * 1-5"   # 4:30pm — interpreted in America/New_York (Prefect handles DST)
      timezone: America/New_York
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW   # a late trigger should not stack on a running one
    enforce_parameter_schema: true
    work_pool: *default_pool

  # ── EOD prices — manual backfill ──────────────────────────────────────────
  - name: backfill
    description: >
      Manually backfill EOD prices for a specific trade_date.
      Trigger from the UI or CLI: prefect deployment run 'eod-prices-daily/backfill' -p trade_date=2026-01-15
    entrypoint: domains.eod_prices.flows:eod_prices_flow
    tags:
      - eod-prices
      - backfill
    # No schedule — manual trigger only.
    parameters:
      trade_date: null   # must be supplied at run time; null means "use last completed trading day"
    enforce_parameter_schema: true
    work_pool: *default_pool

  # ── Exchanges — manual / monthly refresh ─────────────────────────────────
  - name: refresh
    flow_name: exchanges-refresh
    description: >
      Refresh the list of stock exchanges from EODHD.
      Run manually or on a monthly schedule once implemented.
    entrypoint: domains.exchanges.flows:exchanges_flow
    tags:
      - exchanges
      - stub
    <<: *stub

  # ── Exchange schedules — manual / monthly refresh ───────────────────────────
  - name: schedules-refresh
    flow_name: exchange-schedules-refresh
    description: >
      Refresh trading hours and holidays for all exchanges supported by the
      EODHD v2 exchange-details API (MIC-style codes, distinct from catalog codes).
    entrypoint: domains.exchange_schedules.flows:exchange_schedules_flow
    tags:
      - exchanges
      - schedules
    parameters:
      snapshot_date: null
      exchange_codes: null
    enforce_parameter_schema: true
    work_pool: *default_pool

  # ── Instruments — weekly refresh ──────────────────────────────────────────
  - name: weekly
    flow_name: instruments-refresh
    description: >
      Refresh active instruments across EODHD exchanges, including equities,
      ETFs, funds, FX, crypto, bonds, and other provider-supported asset classes.
      Scheduled for Monday 8am ET when activated.
    entrypoint: domains.instruments.flows:instruments_flow
    tags:
      - instruments
      - stub
    schedule:
      cron: "0 8 * * 1"
      timezone: America/New_York
    <<: *stub

  # ── Fundamentals — quarterly ───────────────────────────────────────────────
  - name: quarterly
    flow_name: fundamentals-quarterly
    description: >
      Ingest income statements, balance sheets, and ratios from EODHD.
      Manually triggered during earnings season once implemented.
    entrypoint: domains.fundamentals.flows:fundamentals_flow
    tags:
      - fundamentals
      - stub
    <<: *stub
