[project]
name = "pipelines"
version = "0.1.0"
description = "Prefect ingestion pipelines for the unique-stocks data platform"
requires-python = ">=3.14.3"
dependencies = [
    "prefect>=3.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "duckdb>=1.0",
    "structlog>=24.2",
    "exchange-calendars>=4.5",
    "tenacity>=8.3",
    "boto3>=1.43.9",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "respx>=0.21",
    "ruff>=0.15",
    "basedpyright",
    "pre-commit>=4.2",
    "sqlfluff>=4.1",
    "ty>=0.0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["domains", "core", "providers"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "I",   # import formatting
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "D",   # docstrings
]

# 'ignore' specifies which linting rules to ignore:
ignore = [
    "D203", # One blank line required before class docstring
    "D213", # multi-line-summary-second-line (conflicts with D212)
    "D100", # missing docstring in public module
    "B018", # Found useless expression
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
include = ["domains", "core", "tests", "providers"]
extraPaths = ["."]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
pythonVersion = "3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
